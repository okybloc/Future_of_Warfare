<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Future of Warfare: System of Autonomous Systems</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
:root{--green:#1aff9a;--green-d:#175c40;--green-dd:#0a3a28;--amber:#ffd24a;--red:#e8443a;--text:#bfe8d4;--dim:#6a9a80;--bg:#020a06;--panel:#081712;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;background:var(--bg);}
body{display:flex;align-items:center;justify-content:center;font-family:'Share Tech Mono',ui-monospace,Menlo,Consolas,monospace;color:var(--text);}
#gameCanvas{display:block;cursor:crosshair;background:#04100b;}
#ui{position:fixed;inset:0;display:none;overflow:auto;background:rgba(2,10,6,0.94);padding:14px;font-size:12px;line-height:1.45;}
.wrap{max-width:1120px;margin:0 auto;}
.hdr{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--green-d);padding-bottom:8px;margin-bottom:10px;}
.hdr h1{font-size:18px;letter-spacing:3px;color:var(--green);font-weight:normal;}
.hdr .sub{color:var(--dim);font-size:11px;letter-spacing:1px;}
.stat{border:1px solid var(--green-d);border-radius:6px;padding:4px 10px;background:var(--panel);white-space:nowrap;}
.stat b{color:var(--green);font-weight:normal;}
.stat.bad b{color:var(--red);}
.row{display:flex;flex-wrap:wrap;gap:10px;}
.box{background:var(--panel);border:1px solid var(--green-dd);border-radius:8px;padding:10px 12px;flex:1 1 300px;min-width:0;}
.box h2{font-size:11px;letter-spacing:3px;color:var(--dim);font-weight:normal;margin-bottom:8px;}
.intel{margin-bottom:10px;}
.intel p{color:#a8d0ba;margin-bottom:4px;}
.intel .hint{color:var(--amber);}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.tab{flex:1 1 150px;border:1px solid var(--green-dd);border-radius:8px;padding:8px 10px;cursor:pointer;background:var(--panel);user-select:none;}
.tab.sel{border-color:var(--green);background:#0c2218;}
.tab .n{font-size:14px;letter-spacing:2px;}
.tab .c{color:var(--dim);font-size:11px;}
.field{margin-bottom:8px;}
.field .lab{font-size:10px;letter-spacing:2px;color:var(--dim);margin-bottom:3px;}
.opts{display:flex;flex-wrap:wrap;gap:4px;}
.opt{border:1px solid var(--green-dd);border-radius:5px;padding:3px 8px;cursor:pointer;color:#8fb8a2;background:#06120d;user-select:none;}
.opt:hover{border-color:var(--green-d);}
.opt.sel{border-color:var(--green);color:var(--green);background:#0e2a1e;}
.desc{color:var(--dim);font-size:11px;margin-top:3px;min-height:16px;}
.item{border:1px solid var(--green-dd);border-radius:6px;padding:5px 8px;cursor:pointer;margin-bottom:4px;background:#06120d;user-select:none;}
.item b{font-weight:normal;color:#bfe8d4;}
.item span{display:block;color:var(--dim);font-size:11px;}
.item.sel{border-color:var(--amber);background:#1a1808;}
.item.sel b{color:var(--amber);}
.tier{display:flex;gap:6px;margin-bottom:6px;align-items:stretch;}
.tier .tl{width:22px;color:var(--dim);font-size:10px;display:flex;align-items:center;}
.rune{flex:1;border:1px solid var(--green-dd);border-radius:6px;padding:5px 8px;cursor:pointer;background:#06120d;user-select:none;}
.rune b{font-weight:normal;color:#bfe8d4;}
.rune span{display:block;color:var(--dim);font-size:11px;}
.rune.on{border-color:#b98cff;background:#17102a;}
.rune.on b{color:#cdb0ff;}
.rune.locked{opacity:0.4;cursor:not-allowed;}
.step{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.step .sl{flex:1;}
.step button,.btn{font-family:inherit;font-size:12px;border:1px solid var(--green-d);background:#0e2a1e;color:var(--green);border-radius:5px;padding:3px 10px;cursor:pointer;}
.step .v{width:22px;text-align:center;color:var(--green);font-size:14px;}
.btn.big{font-size:16px;letter-spacing:3px;padding:10px 34px;border-color:var(--green);background:linear-gradient(180deg,#1aff9a,#0d9a5a);color:#04140c;}
.btn.big[disabled]{background:#12241c;color:#4a6a5a;border-color:var(--green-dd);cursor:not-allowed;}
.btn.ghost{background:transparent;color:var(--dim);border-color:var(--green-dd);}
.foot{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-top:10px;flex-wrap:wrap;}
.warn{color:var(--red);}
table{border-collapse:collapse;width:100%;}
th,td{text-align:right;padding:4px 8px;border-bottom:1px solid var(--green-dd);}
th{color:var(--dim);font-weight:normal;font-size:10px;letter-spacing:1px;}
td:first-child,th:first-child{text-align:left;}
.result{font-size:26px;letter-spacing:4px;margin-bottom:4px;}
.obs li{margin:0 0 5px 16px;color:#a8d0ba;}
.stars{color:var(--amber);font-size:20px;letter-spacing:4px;}
.wrap{max-width:1500px;}
.cmd{display:grid;grid-template-columns:minmax(340px,0.8fr) 1.5fr;gap:10px;align-items:start;}
.cleft{position:sticky;top:0;display:flex;flex-direction:column;gap:10px;}
.cleft .box,.cleft .intel{flex:none;margin-bottom:0;}
@media (max-width:900px){.cmd{grid-template-columns:1fr;}.cleft{position:static;}}
.rule{margin-bottom:6px;color:var(--dim);font-size:11px;letter-spacing:1px;}
.rule select{font-family:inherit;font-size:12px;background:#06120d;color:var(--green);border:1px solid var(--green-d);border-radius:5px;padding:3px 4px;max-width:100%;margin:2px 0;}
.stat .opt{display:inline-block;padding:0 7px;}
</style>
</head>

/* ------------------------------------------------------------------

var TYPE_ORDER = ['striker', 'interceptor', 'scout', 'decoy'];

var MAX_PER_TYPE = 8;

//  Doctrine cards. Each field: id, label, options [value, name, what it does].
var DEPTH = { id: 'depth', label: 'STATION DEPTH', opts: [
    ['forward', 'Forward', 'High in the water, far past the comms boundary. Pushed back as the flotilla descends.'],
    ['mid', 'Mid-water', 'Around the comms boundary.'],
    ['rear', 'Rear', 'Close to the node, inside comms, where recall always works.'],

var SPREAD = { id: 'spread', label: 'FORMATION', opts: [

var THREAT = { id: 'threat', label: 'UNDER FIRE', opts: [

    ['balanced', 'Balanced', 'Dodges charges that are about to hit.'],

var RETREAT = { id: 'retreat', label: 'WHEN DAMAGED', opts: [
    ['never', 'Fight on', 'Stays in the fight until destroyed.'],
    ['damaged', 'Return to base', 'At half hull it heads home by itself, is repaired, and joins the reserve.']] };

var DOCTRINE = {
    striker: [DEPTH, SPREAD,
        { id: 'pursuit', label: 'PURSUIT', opts: [
            ['hold', 'Hold station', 'Only engages what passes over its station.'],
            ['track', 'Track targets', 'Slides far along the line to get under its target.']] },
        { id: 'priority', label: 'TARGET PRIORITY', opts: [
            ['lowest', 'Closest to node', 'Shoots the lowest contacts first.'],
            ['nearest', 'Nearest to me', 'Shoots whatever is closest to itself.'],
            ['heavy', 'Toughest first', 'Goes for the contact with the most hull.'],
            ['weak', 'Finish wounded', 'Prefers contacts that are already damaged.'],
            ['threat', 'Hunters & jammers', 'Hunters and jammers first, then the lowest contact.']] },
        { id: 'coord', label: 'COORDINATION', opts: [
            ['spread', 'Spread fire', 'Avoids contacts another striker already has.'],
            ['focus', 'Mass fire', 'Piles onto contacts other strikers are engaging.']] },
        { id: 'discipline', label: 'FIRE DISCIPLINE', opts: [
            ['free', 'Fire at will', 'Shoots at anything, including fuzzy unclassified returns (often missing).'],
            ['classified', 'Classified only', 'Holds fire until a contact is classified.'],
            ['close', 'Close range only', 'Holds fire until the target is within 210.']] },
        THREAT, RETREAT],
    interceptor: [DEPTH, SPREAD,
        { id: 'pursuit', label: 'PURSUIT', opts: [
            ['hold', 'Hold station', 'Covers the water above its station.'],
            ['track', 'Roam', 'Slides sideways to get under whatever it is shooting at.']] },
        { id: 'protect', label: 'PROTECT', opts: [
            ['node', 'The node', 'Shoots the charge closest to the seabed.'],
            ['fleet', 'The fleet', 'Shoots charges that are falling onto a friendly vehicle.'],
            ['nearest', 'Itself', 'Shoots whatever charge is nearest.']] },
        { id: 'hunters', label: 'HUNTERS', opts: [

        { id: 'sweep', label: 'SWEEP', opts: [
            ['hold', 'Hold', 'Stays on station.'],
            ['patrol', 'Patrol', 'Sweeps side to side to cover more of the flotilla.']] },
        THREAT],
    decoy: [DEPTH, SPREAD,
        { id: 'lure', label: 'EMISSIONS', opts: [
            ['always', 'Always on', 'Lures charges for as long as it lives.'],
            ['quiet', 'Quiet when hurt', 'Stops emitting at half hull so it can repair.']] },
        RETREAT]

var LOADOUT = {

        { slot: 'b', label: 'SYSTEM', items: [

    scout: [
        { slot: 'a', label: 'SENSOR', items: [
            ['wide', 'Wide passive array', 'Classifies contacts within 175.'],
            ['focused', 'Focused array', 'Half the range, but contacts it classifies take +1 damage.'],

        { slot: 'b', label: 'SYSTEM', items: [
            ['std', 'Standard', 'Standard fit.'],
            ['stealth', 'Quiet coating', 'Hunters cannot find it.'],
            ['sprint', 'Sprint drive', '+40% speed.']] }],
    decoy: [
        { slot: 'a', label: 'PAYLOAD', items: [
            ['noise', 'Noisemaker', 'Lures charges within 150.'],
            ['loud', 'Loudhailer', 'Lure radius +50%, -2 hull.'],
            ['shield', 'Shield projector', 'No lure. Destroys charges within 45, at 1 hull each.']] },
        { slot: 'b', label: 'SYSTEM', items: [
            ['std', 'Standard', 'Standard fit.'],
            ['armor', 'Armour', '+3 hull, 30% slower.'],
            ['repair', 'Damage control', 'Repairs twice as fast.']] }]
};

//  Runes: [id, tier, name, effect]. Tier II needs a tier I rune of the same type, tier III needs a tier II.
var RUNES = {
    striker: [
        ['s1a', 1, 'Steady Hands', '-35% aim error.'],
        ['s1b', 1, 'Hot Tubes', '-15% reload time.'],
        ['s2a', 2, 'Fast Fish', '+25% torpedo speed.'],

        ['s3', 3, 'Double Tap', '30% chance of an immediate second shot.']],

        ['i1a', 1, 'Quick Loader', '-20% reload time.'],
        ['i1b', 1, 'Long Eyes', '+25% range.'],
        ['i2a', 2, 'Hunter-Killer', 'Triple damage to hunters.'],
        ['i2b', 2, 'Tracking Computer', '+30% shot speed.'],
        ['i3', 3, 'Twin Mount', 'Engages two charges at once.']],
    scout: [
        ['c1a', 1, 'Sharp Ears', '+25% sensor range.'],
        ['c1b', 1, 'Ghost', 'Dodges 60% better.'],
        ['c2a', 2, 'Persistent Track', 'Classification lasts 2.5x longer.'],
        ['c2b', 2, 'Signal Boost', 'Relay bubble +50%. Home comms boundary reaches 50 further.'],
        ['c3', 3, 'Weak-Point Analysis', 'Contacts classified by scouts take +1 damage.']],
    decoy: [
        ['d1a', 1, 'Thick Skin', '+2 hull.'],
        ['d1b', 1, 'Loud', '+25% lure radius.'],
        ['d2a', 2, 'Damage Control', 'Repairs twice as fast.'],
        ['d2b', 2, 'Chaff Burst', 'When destroyed, clears every charge within 110.'],
        ['d3', 3, 'Phantom Fleet', 'Pulls lured charges twice as hard.']]
};

//  Standing orders: IF a trigger is true THEN override part of the doctrine.
var TRIGGERS = [
    ['none', '(no standing order)'],
    ['hunter', 'a hunter is within 160'],
    ['charges', '4 or more charges are close'],
    ['hurt', 'my hull is damaged'],
    ['close', 'the flotilla is past the comms boundary'],
    ['few', 'fewer than 12 contacts remain'],
    ['node', 'the node is below 50%'],
    ['blind', 'no scouts are alive']
];
var ACTIONS = [
    ['none', '(do nothing)'],
    ['rtb', 'return to base'],
    ['rear', 'fall back to rear depth'],
    ['forward', 'push to forward depth'],
    ['evasive', 'evade first'],
    ['press', 'press on, stop dodging'],
    ['hunt', 'go for hunters first'],
    ['track', 'track / roam freely'],
    ['hold', 'hold fire / go quiet'],
    ['free', 'fire at will'],
    ['mass', 'mass fire']
];

var MISSIONS = [
    { name: 'PICKET LINE', budget: 22, ranks: 4, files: 8, heavyRanks: 0, speed: 1.0, bomb: 1.0, hunterEvery: 0, jammers: 0, minelayers: 0, flankers: 0, boss: false,
      brief: 'A thin line of pickets is descending on the cable node. A shakedown for your doctrine.',
      intel: ['32 pickets, 1 hull each, light depth-charge fire.', 'Contacts are fuzzy until a scout classifies them. Torpedoes fired at fuzzy contacts mostly miss.'] },
    { name: 'HEAVY ESCORT', budget: 24, ranks: 5, files: 9, heavyRanks: 2, speed: 1.1, bomb: 1.35, hunterEvery: 0, jammers: 0, minelayers: 0, flankers: 0, boss: false,
      brief: 'Tenders with 2 hull ride at the back of this formation, and the charge fire is heavier.',
      intel: ['45 contacts, the rear two ranks are tenders (2 hull).', 'Charges that reach the seabed cost the node 5% each. Interceptors and decoys earn their keep here.'] },
    { name: 'HUNTER PACK', budget: 26, ranks: 5, files: 9, heavyRanks: 1, speed: 1.1, bomb: 1.2, hunterEvery: 8, jammers: 0, minelayers: 0, flankers: 0, boss: false,
      brief: 'Contacts will break formation and ram your vehicles.',
      intel: ['Hunters (red darts, 2 hull) go for the nearest vehicle and kill most of them outright.', 'Interceptors can be told to engage hunters; strikers can prioritise them. Standing orders can react to a hunter getting close.'] },
    { name: 'MINEFIELD', budget: 27, ranks: 5, files: 9, heavyRanks: 2, speed: 1.1, bomb: 1.3, hunterEvery: 0, jammers: 0, minelayers: 4, flankers: 0, boss: false,
      brief: 'Minelayers are seeding the water column between you and the flotilla.',
      intel: ['4 minelayers (teal). Their mines sink to mid-water and sit there for 30 seconds. A mine kills most vehicles.', 'Interceptors shoot mines when they have nothing more urgent. Sink the minelayers early.'] },
    { name: 'BLACKOUT', budget: 28, ranks: 5, files: 10, heavyRanks: 2, speed: 1.15, bomb: 1.3, hunterEvery: 15, jammers: 4, minelayers: 0, flankers: 0, boss: false,
      brief: 'Jammers are embedded in the formation. Contacts near a jammer stay fuzzy unless a scout is very close.',
      intel: ['4 jammers (purple). Kill them or get scouts in tight.', 'Homing torpedoes and active sonar do not care about jamming as much.'] },
    { name: 'PINCER', budget: 30, ranks: 4, files: 9, heavyRanks: 1, speed: 1.1, bomb: 1.2, hunterEvery: 16, jammers: 0, minelayers: 0, flankers: 8, boss: false,
      brief: 'While the main body holds your attention, fast raiders run down both edges toward the node.',
      intel: ['8 flankers (orange, 2 hull) come down the left and right edges one at a time. One reaching the breach line ends the mission.', 'A tight centre formation will never see them.'] },
    { name: 'THE FLOTILLA', budget: 31, ranks: 6, files: 11, heavyRanks: 3, speed: 1.25, bomb: 1.6, hunterEvery: 10, jammers: 3, minelayers: 0, flankers: 0, boss: false,
      brief: 'Everything at once, and more of it.',
      intel: ['66 contacts: tenders, jammers and hunters, with heavy charge fire.', 'You will probably need to recall and redeploy during the fight.'] },
    { name: 'MOTHERSHIP', budget: 33, ranks: 3, files: 10, heavyRanks: 1, speed: 1.2, bomb: 1.3, hunterEvery: 0, jammers: 0, minelayers: 0, flankers: 0, boss: true,
      brief: 'A command vessel is directing the attack from the surface layer. The engagement ends when everything is sunk.',
      intel: ['Mothership: 45 hull, drops charge salvos and launches hunters.', 'It stays high, far beyond your comms boundary.'] }
];

/* ------------------------------------------------------------------
    The player's program and campaign progress.
   ------------------------------------------------------------------ */

function defaultProgram() {
    return {
        striker:     { doctrine: { depth: 'mid', spread: 'wide', pursuit: 'hold', priority: 'nearest', coord: 'spread', discipline: 'free', threat: 'balanced', retreat: 'never' },
                       loadout: { a: 'light', b: 'passive' }, runes: {}, deploy: 4, reserve: 0 },
        interceptor: { doctrine: { depth: 'rear', spread: 'tight', pursuit: 'hold', protect: 'nearest', hunters: 'ignore', threat: 'balanced', retreat: 'never' },
                       loadout: { a: 'pd', b: 'std' }, runes: {}, deploy: 2, reserve: 0 },
        scout:       { doctrine: { depth: 'rear', spread: 'wide', sweep: 'hold', threat: 'balanced' },
                       loadout: { a: 'wide', b: 'std' }, runes: {}, deploy: 1, reserve: 1 },
        decoy:       { doctrine: { depth: 'rear', spread: 'tight', lure: 'always', retreat: 'never' },
                       loadout: { a: 'noise', b: 'std' }, runes: {}, deploy: 1, reserve: 0 }
    };
}

//  Three doctrine pages the player can keep and switch between, like rune pages.
var pages = [defaultProgram(), defaultProgram(), defaultProgram()];
var progress = { mission: 0, cleared: 0, page: 0, attempts: [], stars: [] };
var program = pages[0];

//  Fill in anything a page or save is missing, and point 'program' at the active page.
function normalize() {
    for (var n = 0; n < pages.length; n++) {
        for (var i = 0; i < TYPE_ORDER.length; i++) {
            var p = pages[n][TYPE_ORDER[i]];
            if (!p.rules) { p.rules = [{ when: 'none', then: 'none' }, { when: 'none', then: 'none' }]; }
        }
    }
    while (progress.attempts.length < MISSIONS.length) { progress.attempts.push(0); }
    while (progress.stars.length < MISSIONS.length) { progress.stars.push(0); }
    if (!(progress.page >= 0 && progress.page < pages.length)) { progress.page = 0; }
    if (!(progress.mission >= 0 && progress.mission < MISSIONS.length)) { progress.mission = 0; }
    program = pages[progress.page];
}
normalize();

function saveGame() {
    try { window.localStorage.setItem('fow_sas_v4', JSON.stringify({ pages: pages, progress: progress })); } catch (e) {}
}
function loadGame() {
    try {
        var raw = window.localStorage.getItem('fow_sas_v4');
        if (!raw) { return; }
        var data = JSON.parse(raw);
        if (data && data.pages && data.pages.length === 3 && data.progress && data.pages[0].striker && data.pages[0].striker.doctrine) {
            pages = data.pages; progress = data.progress;
        }
    } catch (e) {}
    normalize();
}

function runePointsTotal() { return 3 + progress.cleared * 2; }
function runePointsSpent() {
    var n = 0;
    for (var i = 0; i < TYPE_ORDER.length; i++) { n += Object.keys(program[TYPE_ORDER[i]].runes).length; }
    return n;
}
function forceCost() {
    var n = 0;
    for (var i = 0; i < TYPE_ORDER.length; i++) {
        var t = TYPE_ORDER[i];
        n += (program[t].deploy + program[t].reserve) * DRONE_TYPES[t].cost;
    }
    return n;
}
function runeTier(type, id) {
    for (var i = 0; i < RUNES[type].length; i++) { if (RUNES[type][i][0] === id) return RUNES[type][i][1]; }
    return 0;
}
function hasTier(type, tier) {
    for (var id in program[type].runes) { if (runeTier(type, id) === tier) return true; }
    return false;
}
//  Drop any rune whose prerequisite tier is no longer held.
function pruneRunes(type) {
    for (var pass = 0; pass < 2; pass++) {
        for (var id in program[type].runes) {
            var tier = runeTier(type, id);
            if (tier > 1 && !hasTier(type, tier - 1)) { delete program[type].runes[id]; }
        }
    }
}

//  Turn a type's loadout and runes into the numbers its vehicles fight with.
function buildSpec(type) {
    var p = program[type], L = p.loadout, R = p.runes, base = DRONE_TYPES[type];
    var s = { type: type, hp: base.hp, speed: base.speed, dodge: 1 };
    if (type === 'striker') {
        s.cool = 2.3; s.dmg = 1; s.projSpeed = 210; s.errC = 0.015; s.errU = 0.3;
        s.homing = false; s.fireRange = 9999; s.selfClassify = 0; s.lure = 0; s.pull = 0; s.doubleTap = 0;
        if (L.a === 'heavy') { s.dmg = 2; s.cool = 3.6; s.projSpeed = 165; }
        if (L.a === 'homing') { s.homing = true; s.cool = 3.1; s.projSpeed = 180; }
        if (L.a === 'darts') { s.dmg = 0.5; s.cool = 0.95; s.projSpeed = 290; s.fireRange = 230; }
        if (L.b === 'active') { s.selfClassify = 150; s.lure = 115; s.pull = 55; }
        if (L.b === 'plating') { s.hp += 1; s.speed *= 0.8; }
        if (R.s1a) { s.errC *= 0.65; s.errU *= 0.65; }
        if (R.s1b) { s.cool *= 0.85; }
        if (R.s2a) { s.projSpeed *= 1.25; }
        if (R.s2b) { s.hp += 1; }
        if (R.s3) { s.doubleTap = 0.3; }
    } else if (type === 'interceptor') {
        s.cool = 0.5; s.range = 200; s.projSpeed = 430; s.flak = 0; s.hunterDmg = 0.5; s.twin = false;
        if (L.a === 'flak') { s.flak = 34; s.cool = 1.3; }
        if (L.a === 'long') { s.range = 310; s.cool = 0.8; }
        if (L.b === 'sprint') { s.speed *= 1.4; s.hp -= 1; }
        if (L.b === 'armor') { s.hp += 2; s.speed *= 0.75; }
        if (R.i1a) { s.cool *= 0.8; }
        if (R.i1b) { s.range *= 1.25; }
        if (R.i2a) { s.hunterDmg *= 3; }
        if (R.i2b) { s.projSpeed *= 1.3; }
        if (R.i3) { s.twin = true; }
    } else if (type === 'scout') {
        s.sensor = 175; s.classifyTime = 6; s.weak = 0; s.relay = 0; s.stealth = false; s.commsBonus = 0;
        if (L.a === 'focused') { s.sensor = 95; s.weak = 1; }
        if (L.a === 'relay') { s.sensor = 110; s.relay = 170; }
        if (L.b === 'stealth') { s.stealth = true; }
        if (L.b === 'sprint') { s.speed *= 1.4; }
        if (R.c1a) { s.sensor *= 1.25; }
        if (R.c1b) { s.dodge *= 1.6; }
        if (R.c2a) { s.classifyTime *= 2.5; }
        if (R.c2b) { s.relay *= 1.5; s.commsBonus = 50; }
        if (R.c3) { s.weak += 1; }
    } else {
        s.lure = 150; s.pull = 95; s.regen = 6; s.shield = 0; s.chaff = false;
        if (L.a === 'loud') { s.lure *= 1.5; s.hp -= 2; }
        if (L.a === 'shield') { s.lure = 0; s.shield = 45; }
        if (L.b === 'armor') { s.hp += 3; s.speed *= 0.7; }
        if (L.b === 'repair') { s.regen /= 2; }
        if (R.d1a) { s.hp += 2; }
        if (R.d1b) { s.lure *= 1.25; }
        if (R.d2a) { s.regen /= 2; }
        if (R.d2b) { s.chaff = true; }
        if (R.d3) { s.pull *= 2; }
    }
    return s;
}

var BOUNDS = { left: 40, right: 920, top: 78, bottom: 590, breach: 485 };

//  Where the doctrine says a vehicle should stand. Used by the engagement and by the base map table.
function stationFor(type, doc, slot, slots, lowY, elapsed, anchor) {
    var b = BOUNDS, x, y;
    if (anchor) {
        x = anchor.x;
    } else if (doc.spread === 'wide') {
        x = slots === 1 ? W / 2 : b.left + 70 + slot / (slots - 1) * (b.right - b.left - 140);
    } else if (doc.spread === 'tight') {
        x = W / 2 + (slot - (slots - 1) / 2) * 46;
    } else {
        var k = Math.floor(slot / 2);
        x = (slot % 2 === 0) ? b.left + 90 + k * 46 : b.right - 90 - k * 46;
    }
    var offset = { striker: 0, interceptor: 28, scout: -30, decoy: -12 }[type];
    if (doc.depth === 'forward') { y = 290 + offset; }
    else if (doc.depth === 'mid') { y = 395 + offset; }
    else if (doc.depth === 'rear') { y = 505 + offset; }
    else { y = lowY + { striker: 165, interceptor: 215, scout: 85, decoy: 120 }[type]; }
    if (anchor && anchor.y !== null && doc.depth !== 'shadow') { y = anchor.y; }
    if (doc.sweep === 'patrol') { x += Math.sin(elapsed * 0.5 + slot * 2.1) * 130; }
    //  Never sit where the flotilla is about to be.
    y = clamp(Math.max(y, lowY + 42), 120, b.bottom - 16);
    return { x: clamp(x, b.left + 10, b.right - 10), y: y };
}

//  Build a mission's opening formation.
function buildFormation(def) {
    var ranks = def.ranks, files = def.files, top = BOUNDS.top + (def.boss ? 62 : 0), i;
    var invaders = [];
    for (var rank = 0; rank < ranks; rank++) {
        for (var file = 0; file < files; file++) {
            invaders.push(new Invader(
                (W / 2) + ((files / 2 - file) * 440 / files) - 220 / files,
                (top + rank * 30),
                rank, file, rank < def.heavyRanks ? 'tender' : 'picket'));
        }
    }
    //  Jammers sit in the second rank from the front, minelayers in the rank behind them, evenly spaced.
    for (i = 0; i < def.jammers; i++) {
        var j = invaders[(ranks - 2) * files + Math.floor((i + 0.5) * files / def.jammers)];
        j.type = 'jammer'; j.hp = 2; j.maxHp = 2;
    }
    for (i = 0; i < def.minelayers; i++) {
        var ml = invaders[(ranks - 3) * files + Math.floor((i + 0.5) * files / def.minelayers)];
        ml.type = 'minelayer'; ml.hp = 2; ml.maxHp = 2; ml.mineTimer = 3 + i * 1.5;
    }
    if (def.boss) {
        var boss = new Invader(W / 2, BOUNDS.top + 18, -1, -1, 'mothership');
        boss.boss = true; boss.hp = 45; boss.maxHp = 45; boss.width = 130; boss.height = 26; boss.classified = 1e9;
        invaders.push(boss);
    }
    return invaders;
}

/* ------------------------------------------------------------------
    Game class and state stack (from the original game).
   ------------------------------------------------------------------ */

function Game() {

    //  Set the initial config.
    this.config = {
        bombRate: 0.11,
        bombMinVelocity: 60,
        bombMaxVelocity: 85,
        invaderInitialVelocity: 26,
        invaderAcceleration: 1.5,
        invaderDropDistance: 18,
        fps: 50,
        pointsPerInvader: 5,
        commsY: 420,
        burstRecalls: 2
    };

    //  All state is in the variables below.
    this.integrity = 100;
    this.width = W;
    this.height = H;
    this.gameBounds = BOUNDS;
    this.speed = 1;

    //  The state stack.
    this.stateStack = [];

    //  Input/output
    this.pressedKeys = {};
    this.gameCanvas = null;
    this.mouse = { x: 0, y: 0 };

    //  All sounds.
    this.sounds = new Sounds();
    this.time = 0;
}

//  Initialise the Game with a canvas.
Game.prototype.initialise = function(gameCanvas) {
    this.gameCanvas = gameCanvas;
};

Game.prototype.moveToState = function(state) {
    //  If we are in a state, leave it.
    if (this.currentState() && this.currentState().leave) {
        this.currentState().leave(this);
    }
    this.stateStack.pop();
    //  If there's an enter function for the new state, call it.
    if (state.enter) {
        state.enter(this);
    }
    this.stateStack.push(state);
};

//  Start the Game.
Game.prototype.start = function() {
    loadGame();
    this.moveToState(new WelcomeState());
};

//  Launch the current mission with the current program.
Game.prototype.launch = function(skipIntro) {
    this.integrity = 100;
    this.speed = 1;
    this.sounds.init();
    saveGame();
    if (skipIntro) { this.moveToState(new PlayState(this.config, progress.mission)); }
    else { this.moveToState(new LevelIntroState(progress.mission)); }
};

//  A mission ended: record it and show the after-action report.
Game.prototype.finishMission = function(play, won, reason) {
    var m = play.mission, firstClear = false;
    progress.attempts[m]++;
    if (won) {
        if (!progress.stars[m]) {
            progress.stars[m] = progress.attempts[m] === 1 ? 3 : (progress.attempts[m] <= 3 ? 2 : 1);
        }
        if (m === progress.cleared && progress.cleared < MISSIONS.length) { progress.cleared++; firstClear = true; }
    }
    saveGame();
    this.moveToState(new ReportState(play, won, reason, firstClear));
};

//  Returns the current state.
Game.prototype.currentState = function() {
    return this.stateStack.length > 0 ? this.stateStack[this.stateStack.length - 1] : null;
};

//  The main loop.
function GameLoop(game, dt) {
    var currentState = game.currentState();
    if (currentState) {
        game.time += dt;
        var ctx = game.gameCanvas.getContext("2d");
        //  Update (several times a frame when the sim is sped up), then draw.
        var steps = (currentState instanceof PlayState) ? game.speed : 1;
        for (var k = 0; k < steps; k++) {
            currentState = game.currentState();
            if (currentState.update) {
                currentState.update(game, dt);
            }
        }
        currentState = game.currentState();
        if (currentState.draw) {
            currentState.draw(game, dt, ctx);
        }
    }
}

//  Inform the game a key is down.
Game.prototype.keyDown = function(keyCode) {
    this.pressedKeys[keyCode] = true;
    if (keyCode == KEY_M) { this.sounds.mute = !this.sounds.mute; }
    if (this.currentState() && this.currentState().keyDown) {
        this.currentState().keyDown(this, keyCode);
    }
};

//  Inform the game a key is up.
Game.prototype.keyUp = function(keyCode) {
    delete this.pressedKeys[keyCode];
};

Game.prototype.mouseDown = function(x, y) {
    this.mouse.x = x; this.mouse.y = y;
    var s = this.currentState();
    if (s && s.mouseDown) { s.mouseDown(this, x, y); }
};
Game.prototype.mouseMove = function(x, y) {
    this.mouse.x = x; this.mouse.y = y;
};

/* ------------------------------------------------------------------
    Shared drawing helpers.
   ------------------------------------------------------------------ */

function drawBackdrop(game, ctx) {
    var b = game.gameBounds;
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0a2a20');
    g.addColorStop(0.5, '#061710');
    g.addColorStop(1, '#030b08');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    //  Depth grid.
    ctx.strokeStyle = 'rgba(26,255,154,0.06)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var x = b.left; x <= b.right; x += 80) { ctx.moveTo(x, 50); ctx.lineTo(x, b.bottom); }
    for (var y = 50; y <= b.bottom; y += 60) { ctx.moveTo(b.left, y); ctx.lineTo(b.right, y); }
    ctx.stroke();

    //  Surface.
    ctx.strokeStyle = 'rgba(120,220,255,0.35)';
    ctx.beginPath();
    for (x = 0; x <= W; x += 12) {
        var sy = 50 + Math.sin(x * 0.05 + game.time * 1.4) * 2.5;
        if (x === 0) ctx.moveTo(x, sy); else ctx.lineTo(x, sy);
    }
    ctx.stroke();

    //  Seabed.
    ctx.fillStyle = '#0c1f17';
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (x = 0; x <= W; x += 24) {
        ctx.lineTo(x, b.bottom + 12 + Math.sin(x * 0.021) * 5 + Math.sin(x * 0.07) * 2);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#175c40';
    ctx.stroke();
}

function drawCentered(ctx, text, y, size, color) {
    ctx.font = size + "px " + FONT;
    ctx.fillStyle = color || '#bfe8d4';
    ctx.textBaseline = "middle";
    ctx.textAlign = "center";
    ctx.fillText(text, W / 2, y);
}

function drawDroneIcon(ctx, type, x, y, time) {
    var c = DRONE_TYPES[type].color;
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = c; ctx.strokeStyle = c; ctx.lineWidth = 1.5;
    ctx.beginPath();
    if (type === 'striker') {
        ctx.moveTo(0, -10); ctx.lineTo(7, 7); ctx.lineTo(0, 3); ctx.lineTo(-7, 7);
        ctx.closePath(); ctx.fill();
    } else if (type === 'interceptor') {
        ctx.moveTo(0, -8); ctx.lineTo(8, 0); ctx.lineTo(0, 8); ctx.lineTo(-8, 0);
        ctx.closePath(); ctx.stroke();
        ctx.fillRect(-2, -2, 4, 4);
    } else if (type === 'scout') {
        ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath();
        ctx.arc(0, 0, 9, time * 3, time * 3 + 1.6); ctx.stroke();
    } else {
        for (var k = 0; k < 6; k++) {
            var a = k * Math.PI / 3;
            if (k === 0) ctx.moveTo(Math.cos(a) * 9, Math.sin(a) * 9); else ctx.lineTo(Math.cos(a) * 9, Math.sin(a) * 9);
        }
        ctx.closePath(); ctx.stroke();
        ctx.globalAlpha = 0.5; ctx.fill();
    }
    ctx.restore();
}

function drawInvader(ctx, invader, time) {
    var x = invader.x, y = invader.y;
    if (invader.classified <= 0 && !invader.boss) {
        //  Unclassified: a fuzzy sonar return.
        var jx = Math.sin(time * 7 + invader.file * 1.7 + invader.rank) * 2.2;
        var jy = Math.cos(time * 6 + invader.file + invader.rank * 2.3) * 1.6;
        ctx.fillStyle = 'rgba(26,255,154,0.20)';
        ctx.beginPath(); ctx.ellipse(x + jx, y + jy, 15, 8, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(26,255,154,0.35)';
        ctx.beginPath(); ctx.ellipse(x + jx, y + jy, 7, 4, 0, 0, Math.PI * 2); ctx.fill();
        return;
    }
    var color = invader.hunter ? '#e8443a' : invader.type === 'tender' ? '#e0a838' : invader.type === 'jammer' ? '#b98cff'
              : invader.type === 'minelayer' ? '#3fd6c0' : invader.type === 'flanker' ? '#ff9a3c' : invader.boss ? '#ff6a5a' : '#d86a4a';
    if (invader.flash > 0) { color = '#ffffff'; }
    var w = invader.width / 2, h = invader.height / 2;
    ctx.fillStyle = color; ctx.strokeStyle = color; ctx.lineWidth = 1.5;
    ctx.beginPath();
    if (invader.hunter) {
        ctx.moveTo(x, y + h + 4); ctx.lineTo(x + w * 0.6, y - h); ctx.lineTo(x - w * 0.6, y - h);
        ctx.closePath(); ctx.fill();
    } else {
        ctx.moveTo(x - w, y); ctx.quadraticCurveTo(x, y - h * 1.5, x + w, y);
        ctx.quadraticCurveTo(x, y + h * 1.5, x - w, y);
        ctx.closePath();
        if (invader.type === 'picket') { ctx.fill(); }
        else { ctx.stroke(); ctx.globalAlpha = 0.45; ctx.fill(); ctx.globalAlpha = 1; }
        ctx.fillStyle = '#04100b';
        ctx.fillRect(x - 3, y - 2, 6, 4);
        if (invader.type === 'jammer') {
            ctx.strokeStyle = 'rgba(185,140,255,0.25)';
            ctx.beginPath(); ctx.arc(x, y, 18 + (time * 30 + invader.file * 9) % 30, 0, Math.PI * 2); ctx.stroke();
        }
    }
    if (invader.boss) {
        ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillRect(x - 50, y - h - 9, 100, 3);
        ctx.fillStyle = color; ctx.fillRect(x - 50, y - h - 9, 100 * invader.hp / invader.maxHp, 3);
    } else if (invader.maxHp > 1) {
        for (var k = 0; k < invader.maxHp; k++) {
            ctx.fillStyle = k < Math.ceil(invader.hp) ? color : 'rgba(255,255,255,0.15)';
            ctx.fillRect(x - invader.maxHp * 3 + k * 6, y - h - 6, 4, 2);
        }
    }
}

/*
    Base State: the home base, where the player programs the fleet.
*/
function BaseState() { this.tab = 'striker'; }

BaseState.prototype.enter = function(game) {
    var self = this;
    uiHandler = function(act, a, b) { self.act(game, act, a, b); };
    this.render();
};
BaseState.prototype.leave = function() { hideUI(); uiHandler = null; };

BaseState.prototype.draw = function(game, dt, ctx) { drawBackdrop(game, ctx); };

BaseState.prototype.act = function(game, act, a, b) {
    var p = program[this.tab];
    if (act === 'tab') { this.tab = a; }
    else if (act === 'doc') { p.doctrine[a] = b; }
    else if (act === 'equip') { p.loadout[a] = b; }
    else if (act === 'rune') {
        if (p.runes[a]) { delete p.runes[a]; pruneRunes(this.tab); }
        else {
            var tier = runeTier(this.tab, a);
            if (runePointsSpent() < runePointsTotal() && (tier === 1 || hasTier(this.tab, tier - 1))) { p.runes[a] = true; }
        }
    }
    else if (act === 'count') {
        var d = parseInt(b, 10);
        var next = p[a] + d;
        if (next >= 0 && p.deploy + p.reserve + d <= MAX_PER_TYPE) { p[a] = next; }
    }
    else if (act === 'mission') {
        var m = progress.mission + parseInt(a, 10);
        if (m >= 0 && m <= Math.min(progress.cleared, MISSIONS.length - 1)) { progress.mission = m; }
    }
    else if (act === 'reset') { program[this.tab] = defaultProgram()[this.tab]; normalize(); }
    else if (act === 'page') { progress.page = parseInt(a, 10); normalize(); }
    else if (act === 'rule') { var parts = a.split(':'); p.rules[parseInt(parts[0], 10)][parts[1]] = b; }
    else if (act === 'launch') {
        if (this.launchProblem()) { return; }
        game.launch(false);
        return;
    }
    saveGame();
    this.render();
};

BaseState.prototype.launchProblem = function() {
    var m = MISSIONS[progress.mission];
    if (forceCost() > m.budget) { return "Over force budget by " + (forceCost() - m.budget) + "."; }
    var deployed = 0;
    for (var i = 0; i < TYPE_ORDER.length; i++) { deployed += program[TYPE_ORDER[i]].deploy; }
    if (deployed === 0) { return "Nothing is set to deploy."; }
    return null;
};

BaseState.prototype.render = function() {
    var m = MISSIONS[progress.mission], t = this.tab, p = program[t], T = DRONE_TYPES[t];
    var cost = forceCost(), pts = runePointsTotal() - runePointsSpent(), i, j, h = '';
    var stars = progress.stars[progress.mission];

    h += '<div class="wrap">';
    h += '<div class="hdr"><div><h1>HOME BASE</h1><div class="sub">PROGRAM THE SYSTEM, THEN LAUNCH IT</div></div>';
    h += '<div class="row" style="align-items:center">';
    h += '<span class="btn ghost" data-act="mission" data-a="-1">&#9664;</span>';
    h += '<div class="stat">MISSION <b>' + (progress.mission + 1) + ' / ' + MISSIONS.length + '  ' + m.name + '</b>' +
         (stars ? ' <span style="color:#ffd24a">' + new Array(stars + 1).join('&#9733;') + '</span>' : '') + '</div>';
    h += '<span class="btn ghost" data-act="mission" data-a="1">&#9654;</span>';
    h += '<div class="stat">ATTEMPTS <b>' + progress.attempts[progress.mission] + '</b></div>';
    h += '<div class="stat' + (cost > m.budget ? ' bad' : '') + '">FORCE <b>' + cost + ' / ' + m.budget + '</b></div>';
    h += '<div class="stat">RUNE POINTS <b>' + pts + '</b></div>';
    h += '<div class="stat">DOCTRINE PAGE ';
    for (i = 0; i < pages.length; i++) {
        h += '<span class="opt' + (i === progress.page ? ' sel' : '') + '" data-act="page" data-a="' + i + '">' + ['I', 'II', 'III'][i] + '</span> ';
    }
    h += '</div>';
    h += '</div></div>';

    h += '<div class="cmd"><div class="cleft">';
    h += '<div class="box intel"><h2>INTELLIGENCE</h2><p>' + m.brief + '</p>';
    for (i = 0; i < m.intel.length; i++) { h += '<p class="hint">&#9656; ' + m.intel[i] + '</p>'; }
    h += '<p class="desc" style="margin-top:8px">In the engagement: <b style="color:var(--green)">1 2 3 4</b> deploy a reserve, <b style="color:#4ad0ff">Q W E R</b> recall a type, <b style="color:var(--amber)">B</b> burst recall. Click the water first to choose where a reserve goes.</p>';
    h += '</div>';
    h += '<div class="box"><h2>MAP TABLE &mdash; OPENING POSITIONS UNDER THIS DOCTRINE</h2><canvas id="mapPreview" style="width:100%;display:block;border-radius:4px"></canvas>' +
         '<div class="desc">Solid icons deploy at launch, hollow rings are reserves. Dashed blue line is the comms boundary. It redraws as you change doctrine.</div></div>';
    h += '</div><div class="cright">';

    h += '<div class="tabs">';
    for (i = 0; i < TYPE_ORDER.length; i++) {
        var tt = TYPE_ORDER[i], pp = program[tt];
        h += '<div class="tab' + (tt === t ? ' sel' : '') + '" data-act="tab" data-a="' + tt + '">' +
             '<div class="n" style="color:' + DRONE_TYPES[tt].color + '">' + DRONE_TYPES[tt].plural + '</div>' +
             '<div class="c">' + pp.deploy + ' deploy &middot; ' + pp.reserve + ' reserve &middot; ' + Object.keys(pp.runes).length + ' runes</div></div>';
    }
    h += '</div>';

    h += '<div class="row">';

    //  Doctrine cards.
    h += '<div class="box" style="flex:1.3 1 340px"><h2>DOCTRINE &mdash; HOW ' + T.plural + ' THINK</h2>';
    var fields = DOCTRINE[t];
    for (i = 0; i < fields.length; i++) {
        var f = fields[i], desc = '';
        h += '<div class="field"><div class="lab">' + f.label + '</div><div class="opts">';
        for (j = 0; j < f.opts.length; j++) {
            var on = p.doctrine[f.id] === f.opts[j][0];
            if (on) { desc = f.opts[j][2]; }
            h += '<span class="opt' + (on ? ' sel' : '') + '" data-act="doc" data-a="' + f.id + '" data-b="' + f.opts[j][0] + '">' + f.opts[j][1] + '</span>';
        }
        h += '</div><div class="desc">' + desc + '</div></div>';
    }
    h += '<h2 style="margin-top:12px">STANDING ORDERS &mdash; OVERRIDES THAT FIRE BY THEMSELVES</h2>';
    for (i = 0; i < p.rules.length; i++) {
        h += '<div class="rule">IF <select data-rule="' + i + '" data-part="when">';
        for (j = 0; j < TRIGGERS.length; j++) {
            h += '<option value="' + TRIGGERS[j][0] + '"' + (p.rules[i].when === TRIGGERS[j][0] ? ' selected' : '') + '>' + TRIGGERS[j][1] + '</option>';
        }
        h += '</select> THEN <select data-rule="' + i + '" data-part="then">';
        for (j = 0; j < ACTIONS.length; j++) {
            h += '<option value="' + ACTIONS[j][0] + '"' + (p.rules[i].then === ACTIONS[j][0] ? ' selected' : '') + '>' + ACTIONS[j][1] + '</option>';
        }
        h += '</select></div>';
    }
    h += '<div class="desc">While the condition holds, the order replaces the matching doctrine card. Vehicles check a few times a second.</div>';
    h += '</div>';

    //  Loadout and force.
    h += '<div class="box"><h2>LOADOUT &mdash; WHAT THEY CARRY</h2>';
    var slots = LOADOUT[t];
    for (i = 0; i < slots.length; i++) {
        h += '<div class="field"><div class="lab">' + slots[i].label + '</div>';
        for (j = 0; j < slots[i].items.length; j++) {
            var it = slots[i].items[j];
            h += '<div class="item' + (p.loadout[slots[i].slot] === it[0] ? ' sel' : '') + '" data-act="equip" data-a="' + slots[i].slot + '" data-b="' + it[0] + '"><b>' + it[1] + '</b><span>' + it[2] + '</span></div>';
        }
        h += '</div>';
    }
    h += '<h2 style="margin-top:12px">FORCE &mdash; ' + T.cost + ' POINTS EACH</h2>';
    var rows = [['deploy', 'Deploy at launch'], ['reserve', 'Hold in reserve']];
    for (i = 0; i < rows.length; i++) {
        h += '<div class="step"><div class="sl">' + rows[i][1] + '</div>' +
             '<button data-act="count" data-a="' + rows[i][0] + '" data-b="-1">&minus;</button><div class="v">' + p[rows[i][0]] + '</div>' +
             '<button data-act="count" data-a="' + rows[i][0] + '" data-b="1">+</button></div>';
    }
    var spec = buildSpec(t);
    h += '<div class="desc">' + T.role + ' Hull ' + spec.hp + ', speed ' + Math.round(spec.speed) + '.</div>';
    h += '</div>';

    //  Rune page.
    h += '<div class="box"><h2>RUNE PAGE &mdash; ' + pts + ' POINT' + (pts === 1 ? '' : 'S') + ' FREE</h2>';
    for (var tier = 1; tier <= 3; tier++) {
        h += '<div class="tier"><div class="tl">' + ['I', 'II', 'III'][tier - 1] + '</div>';
        for (i = 0; i < RUNES[t].length; i++) {
            var r = RUNES[t][i];
            if (r[1] !== tier) { continue; }
            var taken = !!p.runes[r[0]];
            var locked = !taken && ((tier > 1 && !hasTier(t, tier - 1)) || pts <= 0);
            h += '<div class="rune' + (taken ? ' on' : '') + (locked ? ' locked' : '') + '" data-act="rune" data-a="' + r[0] + '"><b>' + r[2] + '</b><span>' + r[3] + '</span></div>';
        }
        h += '</div>';
    }
    h += '<div class="desc">Runes are free to swap between attempts. Each mission you clear earns 2 more points. A tier needs one rune from the tier above it.</div>';
    h += '<div style="margin-top:10px"><span class="btn ghost" data-act="reset">Reset ' + T.plural.toLowerCase() + ' to default</span></div>';
    h += '</div>';

    h += '</div>';

    var problem = this.launchProblem();
    h += '<div class="foot"><div class="' + (problem ? 'warn' : 'desc') + '">' +
         (problem || 'Once launched, vehicles beyond the comms boundary are on their own. You can only field reserves and recall.') + '</div>';
    h += '<button class="btn big" data-act="launch"' + (problem ? ' disabled' : '') + '>LAUNCH</button></div>';
    h += '</div></div></div>';
    var keepScroll = ui.scrollTop;
    showUI(h);
    ui.scrollTop = keepScroll || 0;
    this.drawPreview();
};

//  The map table: the mission's opening formation and where this doctrine puts every vehicle.
BaseState.prototype.drawPreview = function() {
    var cv = document.getElementById('mapPreview');
    if (!cv || !cv.getContext) { return; }
    var cssW = cv.clientWidth || 440, top = 60, s = cssW / W, cssH = Math.round((H - top - 34) * s);
    cv.style.height = cssH + 'px';
    cv.width = cssW * 2; cv.height = cssH * 2;
    var ctx = cv.getContext('2d'), b = BOUNDS, i, n;
    ctx.setTransform(s * 2, 0, 0, s * 2, 0, -top * s * 2);
    ctx.fillStyle = '#04120c'; ctx.fillRect(0, top, W, H);
    ctx.strokeStyle = 'rgba(26,255,154,0.07)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (var gx = b.left; gx <= b.right; gx += 80) { ctx.moveTo(gx, top); ctx.lineTo(gx, b.bottom); }
    for (var gy = 110; gy <= b.bottom; gy += 60) { ctx.moveTo(b.left, gy); ctx.lineTo(b.right, gy); }
    ctx.stroke();

    var def = MISSIONS[progress.mission], invaders = buildFormation(def), lowY = 100;
    for (i = 0; i < invaders.length; i++) {
        invaders[i].classified = 1;
        if (!invaders[i].boss && invaders[i].y > lowY) { lowY = invaders[i].y; }
        drawInvader(ctx, invaders[i], 0);
    }
    var scoutSpec = buildSpec('scout');
    var commsY = 420 - ((scoutSpec.commsBonus && program.scout.deploy + program.scout.reserve > 0) ? scoutSpec.commsBonus : 0);
    ctx.fillStyle = 'rgba(74,208,255,0.05)'; ctx.fillRect(b.left, commsY, b.right - b.left, b.bottom - commsY);
    ctx.setLineDash([10, 6]); ctx.strokeStyle = 'rgba(74,208,255,0.7)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(b.left, commsY); ctx.lineTo(b.right, commsY); ctx.stroke();
    ctx.strokeStyle = 'rgba(232,68,58,0.5)';
    ctx.beginPath(); ctx.moveTo(b.left, b.breach + 8); ctx.lineTo(b.right, b.breach + 8); ctx.stroke();
    ctx.setLineDash([]);
    ctx.font = "13px " + FONT; ctx.textBaseline = "middle";
    ctx.textAlign = "left"; ctx.fillStyle = 'rgba(74,208,255,0.85)'; ctx.fillText("COMMS BOUNDARY", b.left + 4, commsY - 10);
    ctx.textAlign = "right"; ctx.fillStyle = 'rgba(232,68,58,0.8)'; ctx.fillText("BREACH LINE", b.right - 4, b.breach + 20);
    ctx.fillStyle = '#1aff9a'; ctx.fillRect(W / 2 - 26, b.bottom - 8, 52, 8); ctx.fillRect(W / 2 - 5, b.bottom - 16, 10, 8);

    for (i = 0; i < TYPE_ORDER.length; i++) {
        var type = TYPE_ORDER[i], p = program[type], spec = buildSpec(type), total = p.deploy + p.reserve;
        for (n = 0; n < total; n++) {
            var st = stationFor(type, p.doctrine, n, Math.max(1, total), lowY, 0, null);
            if (n < p.deploy) {
                if (type === 'scout') {
                    ctx.strokeStyle = 'rgba(216,255,233,0.22)'; ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.arc(st.x, st.y, spec.sensor, 0, Math.PI * 2); ctx.stroke();
                    if (spec.relay) {
                        ctx.setLineDash([10, 6]); ctx.strokeStyle = 'rgba(74,208,255,0.5)';
                        ctx.beginPath(); ctx.arc(st.x, st.y, spec.relay, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
                    }
                }
                if (type === 'decoy' && spec.lure) {
                    ctx.strokeStyle = 'rgba(255,138,92,0.25)'; ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.arc(st.x, st.y, spec.lure, 0, Math.PI * 2); ctx.stroke();
                }
                ctx.save(); ctx.translate(st.x, st.y); ctx.scale(1.5, 1.5);
                drawDroneIcon(ctx, type, 0, 0, 0);
                ctx.restore();
            } else {
                ctx.strokeStyle = DRONE_TYPES[type].color; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.55;
                ctx.beginPath(); ctx.arc(st.x, st.y, 9, 0, Math.PI * 2); ctx.stroke();
                ctx.globalAlpha = 1;
            }
        }
    }
};

/*
    Level Intro State: mission title and a countdown.
*/
function LevelIntroState(mission) {
    this.mission = mission;
    this.countdown = 2.6;
}

LevelIntroState.prototype.update = function(game, dt) {
    this.countdown -= dt;
    if (this.countdown <= 0) {
        game.moveToState(new PlayState(game.config, this.mission));
    }
};

LevelIntroState.prototype.draw = function(game, dt, ctx) {
    drawBackdrop(game, ctx);
    var m = MISSIONS[this.mission];
    drawCentered(ctx, "MISSION " + (this.mission + 1), H / 2 - 62, 18, '#5a8a72');
    drawCentered(ctx, m.name, H / 2 - 24, 44, '#1aff9a');
    drawCentered(ctx, "Attempt " + (progress.attempts[this.mission] + 1) + ".  Doctrine uploaded. Vehicles launching.", H / 2 + 20, 15, '#a8d0ba');
    drawCentered(ctx, "Contact in " + Math.max(1, Math.ceil(this.countdown)), H / 2 + 56, 20, '#ffd24a');
};

/*
    Play State: the engagement. The fleet runs on the player's program.
*/
function PlayState(config, mission) {
    this.config = config;
    this.mission = mission;
    this.def = MISSIONS[mission];

    //  Game state.
    this.invaderCurrentVelocity = 10;
    this.invaderCurrentDropDistance = 0;
    this.invadersAreDropping = false;
    this.paused = false;
    this.hunterTimer = this.def.hunterEvery || 0;
    this.bossBombTimer = 3;
    this.bossHunterTimer = 6;
    this.elapsed = 0;
    this.launchCool = 0;
    this.burstLeft = config.burstRecalls;
    this.commsY = config.commsY;
    this.lowY = 100;
    this.flankLeft = this.def.flankers || 0;
    this.flankTimer = 7;
    this.marker = null;
    this.events = [];

    //  Game entities.
    this.drones = [];
    this.invaders = [];
    this.rockets = [];
    this.pellets = [];
    this.bombs = [];
    this.fx = [];
    this.comms = [];
    this.buttons = [];
    this.inspect = null;
    this.reserves = {};
    this.specs = {};
    this.slotsFree = {};
    this.slotCount = {};

    //  After-action statistics.
    this.stats = { leaked: 0, causes: { charge: 0, rammed: 0, overrun: 0, mine: 0 }, classifiedAtShot: 0 };
    for (var i = 0; i < TYPE_ORDER.length; i++) {
        this.stats[TYPE_ORDER[i]] = { fielded: 0, lost: 0, kills: 0, shots: 0, hits: 0, intercepts: 0, lured: 0,
            classified: 0, fouled: 0, idle: 0, returned: 0 };
    }
}

PlayState.prototype.say = function(text, color) {
    this.comms.unshift({ text: text, color: color || '#9fe8c4', t: 7 });
    if (this.comms.length > 6) { this.comms.pop(); }
};

PlayState.prototype.enter = function(game) {
    hideUI();
    var def = this.def, i, n, type;

    //  Freeze the program into per-type specs and field the opening force.
    for (i = 0; i < TYPE_ORDER.length; i++) {
        type = TYPE_ORDER[i];
        this.specs[type] = buildSpec(type);
        this.slotCount[type] = Math.max(1, program[type].deploy + program[type].reserve);
        this.slotsFree[type] = [];
        for (n = 0; n < this.slotCount[type]; n++) { this.slotsFree[type].push(n); }
        this.reserves[type] = program[type].deploy + program[type].reserve;
    }
    if (this.specs.scout.commsBonus && program.scout.deploy + program.scout.reserve > 0) { this.commsY -= this.specs.scout.commsBonus; }
    for (i = 0; i < TYPE_ORDER.length; i++) {
        type = TYPE_ORDER[i];
        for (n = 0; n < program[type].deploy; n++) { this.deploy(game, type, true); }
    }

    //  Set the invader params for this mission.
    this.invaderInitialVelocity = this.config.invaderInitialVelocity * def.speed;
    this.bombRate = this.config.bombRate * def.bomb;
    this.bombMinVelocity = this.config.bombMinVelocity * (0.8 + 0.2 * def.bomb);
    this.bombMaxVelocity = this.config.bombMaxVelocity * (0.8 + 0.2 * def.bomb);

    //  Create the invaders.
    var invaders = buildFormation(def);
    this.invaders = invaders;
    this.invaderCurrentVelocity = this.invaderInitialVelocity;
    this.invaderVelocity = { x: -this.invaderInitialVelocity, y: 0 };
    this.invaderNextVelocity = null;

    this.say("BASE: " + invaders.length + " contacts on sonar. Fleet is executing your doctrine.", '#ffd24a');
    game.sounds.playSound('ping');
};

//  Launch one vehicle of a type from the reserve.
PlayState.prototype.deploy = function(game, type, opening) {
    if (this.reserves[type] <= 0 || this.slotsFree[type].length === 0) { return false; }
    if (!opening && this.launchCool > 0) { return false; }
    this.reserves[type]--;
    var slot = this.slotsFree[type].shift();
    var d = new Drone(type, slot, this.specs[type], program[type].doctrine);
    d.rules = program[type].rules;
    d.slots = this.slotCount[type];
    var where = "";
    if (!opening && this.marker) {
        //  Base briefs the vehicle on the designated area before it leaves the link.
        var near = 0;
        for (var i = 0; i < this.drones.length; i++) { if (this.drones[i].anchorId === this.marker.id) { near++; } }
        var side = (near % 2 === 0 ? 1 : -1) * Math.ceil(near / 2) * 26;
        var onEnemy = this.marker.y < this.lowY + 30;
        d.anchor = { x: this.marker.x + side, y: onEnemy ? null : this.marker.y };
        d.anchorId = this.marker.id;
        if (onEnemy) { d.zone = { x: this.marker.x }; where = " to the designated target area"; }
        else { where = " to the designated deployment area"; }
    }
    var st = this.station(game, d);
    if (opening) { d.x = st.x; d.y = Math.min(game.gameBounds.bottom, st.y + 70); }
    else { d.x = W / 2 + (Math.random() * 40 - 20); d.y = game.gameBounds.bottom + 4; this.launchCool = 0.6; }
    this.drones.push(d);
    this.stats[type].fielded++;
    if (!opening) { this.say("BASE: " + d.name + " launched from reserve" + where + ".", '#9fe8c4'); game.sounds.playSound('shoot'); }
    return true;
};

//  Is this vehicle inside the comms boundary, or inside a relay scout's bubble?
PlayState.prototype.inLink = function(d) {
    if (d.y >= this.commsY) { return true; }
    for (var i = 0; i < this.drones.length; i++) {
        var s = this.drones[i];
        if (s.spec.relay && !s.dead) {
            var dx = s.x - d.x, dy = s.y - d.y;
            if (dx * dx + dy * dy < s.spec.relay * s.spec.relay) { return true; }
        }
    }
    return false;
};

//  Recall a type. Only vehicles in link hear it, unless it is a burst recall.
PlayState.prototype.recall = function(game, type, burst) {
    var heard = 0, deaf = 0;
    for (var i = 0; i < this.drones.length; i++) {
        var d = this.drones[i];
        if (d.dead || d.rtb || (type && d.type !== type)) { continue; }
        if (burst || this.inLink(d)) { d.rtb = true; heard++; } else { deaf++; }
    }
    var who = type ? DRONE_TYPES[type].plural : 'ALL VEHICLES';
    if (burst) { this.say("BASE: BURST RECALL. " + heard + " vehicles returning.", '#ffd24a'); }
    else { this.say("BASE: recall " + who + ": " + heard + " acknowledged" + (deaf ? ", " + deaf + " out of link." : "."), deaf ? '#ff9a8a' : '#ffd24a'); }
    game.sounds.playSound('ping');
};

//  Where the doctrine says this vehicle should stand.
PlayState.prototype.station = function(game, d) {
    return stationFor(d.type, d.eff || d.doc, d.slot, d.slots, this.lowY, this.elapsed, d.anchor);
};

//  Is a standing-order trigger true for this vehicle right now?
PlayState.prototype.trigger = function(game, d, when) {
    var i, n = 0;
    if (when === 'hunter') {
        for (i = 0; i < this.invaders.length; i++) {
            var h = this.invaders[i];
            if (h.hunter && !h.dead && (h.x - d.x) * (h.x - d.x) + (h.y - d.y) * (h.y - d.y) < 160 * 160) { return true; }
        }
        return false;
    }
    if (when === 'charges') {
        for (i = 0; i < this.bombs.length; i++) {
            var bm = this.bombs[i];
            if ((bm.x - d.x) * (bm.x - d.x) + (bm.y - d.y) * (bm.y - d.y) < 150 * 150) { n++; }
        }
        return n >= 4;
    }
    if (when === 'hurt') { return d.hp < d.maxHp; }
    if (when === 'close') { return this.lowY >= this.commsY; }
    if (when === 'few') { return this.invaders.length < 12; }
    if (when === 'node') { return game.integrity < 50; }
    if (when === 'blind') { return this.aliveDrones('scout').length === 0; }
    return false;
};

//  Apply standing orders on top of the doctrine cards. Re-evaluated a few times a second.
PlayState.prototype.think = function(game, d, dt) {
    d.ruleTimer -= dt;
    if (d.ruleTimer > 0 && d.eff) { return d.eff; }
    d.ruleTimer = 0.3;
    var eff = d.doc, note = "";
    for (var i = 0; d.rules && i < d.rules.length; i++) {
        var r = d.rules[i];
        if (r.when === 'none' || r.then === 'none' || !this.trigger(game, d, r.when)) { continue; }
        if (eff === d.doc) {
            eff = {};
            for (var k in d.doc) { eff[k] = d.doc[k]; }
        }
        if (r.then === 'rtb') { d.rtb = true; }
        else if (r.then === 'rear') { eff.depth = 'rear'; }
        else if (r.then === 'forward') { eff.depth = 'forward'; }
        else if (r.then === 'evasive') { eff.threat = 'evasive'; }
        else if (r.then === 'press') { eff.threat = 'press'; }
        else if (r.then === 'hunt') { eff.priority = 'threat'; eff.hunters = 'engage'; eff.huntFirst = true; }
        else if (r.then === 'track') { eff.pursuit = 'track'; }
        else if (r.then === 'hold') { eff.holdFire = true; }
        else if (r.then === 'free') { eff.discipline = 'free'; }
        else if (r.then === 'mass') { eff.coord = 'focus'; }
        for (var a = 0; a < ACTIONS.length; a++) { if (ACTIONS[a][0] === r.then) { note = "Standing order: " + ACTIONS[a][1] + "."; } }
    }
    d.eff = eff;
    d.ruleNote = note;
    return eff;
};

PlayState.prototype.aliveDrones = function(type) {
    var out = [];
    for (var i = 0; i < this.drones.length; i++) {
        var d = this.drones[i];
        if (!d.dead && (!type || d.type === type)) { out.push(d); }
    }
    return out;
};

PlayState.prototype.killDrone = function(game, d, cause) {
    d.dead = true;
    this.slotsFree[d.type].push(d.slot);
    this.stats[d.type].lost++;
    this.stats.causes[cause]++;
    this.events.push({ k: 'loss', x: d.x, y: d.y, color: d.color });
    this.fx.push({ x: d.x, y: d.y, r: 4, max: 34, color: d.color });
    game.sounds.playSound('explosion');
    var why = { charge: 'depth charge', rammed: 'rammed by hunter', overrun: 'overrun', mine: 'mine' }[cause];
    this.say(d.name + " lost (" + why + ").", '#ff9a8a');
    if (d.spec.chaff) {
        for (var i = 0; i < this.bombs.length; i++) {
            var bm = this.bombs[i];
            if ((bm.x - d.x) * (bm.x - d.x) + (bm.y - d.y) * (bm.y - d.y) < 110 * 110) { this.bombs.splice(i--, 1); }
        }
        this.fx.push({ x: d.x, y: d.y, r: 10, max: 110, color: '#ff8a5c' });
    }
    if (this.inspect === d) { this.inspect = null; }
};

PlayState.prototype.damageDrone = function(game, d, amount, cause) {
    d.hp -= amount;
    d.flash = 0.25;
    if (d.hp <= 0) { this.killDrone(game, d, cause); }
    else { game.sounds.playSound('bang'); }
};

PlayState.prototype.hitInvader = function(game, invader, dmg, by) {
    invader.hp -= dmg + (invader.classified > 0 && !invader.boss ? invader.weak : 0);
    invader.flash = 0.2;
    if (!invader.boss) { invader.classified = Math.max(invader.classified, 2.5); }
    if (invader.hp <= 0) {
        invader.dead = true;
        this.events.push({ k: 'kill', x: invader.x, y: invader.y });
        this.fx.push({ x: invader.x, y: invader.y, r: 3, max: invader.boss ? 120 : 26, color: '#ffb060' });
        game.sounds.playSound(invader.boss ? 'explosion' : 'bang');
        if (by) {
            this.stats[by.type].kills++;
            if (invader.boss) { this.say(by.name + ": MOTHERSHIP DESTROYED.", '#ffd24a'); }
            else if (Math.random() < 0.15) { this.say(by.name + ": splash one " + invader.type + "."); }
        }
    }
};

PlayState.prototype.update = function(game, dt) {

    //  Pause: the world holds still.
    if (this.paused) { return; }

    var b = game.gameBounds, i, j, d, invader, bomb, def = this.def;
    this.elapsed += dt;
    this.launchCool -= dt;

    //  Timers on comms and effects.
    for (i = 0; i < this.comms.length; i++) { this.comms[i].t -= dt; }
    for (i = 0; i < this.fx.length; i++) {
        this.fx[i].r += dt * 70;
        if (this.fx[i].r > this.fx[i].max) { this.fx.splice(i--, 1); }
    }

    //  Anything that emits (decoys, active sonar) lures bombs sideways. Shields eat them.
    var alive = this.aliveDrones();
    for (i = 0; i < this.bombs.length; i++) {
        bomb = this.bombs[i];
        for (j = 0; j < alive.length; j++) {
            d = alive[j];
            if (d.dead) { continue; }
            var dx = d.x - bomb.x, dy = d.y - bomb.y, d2 = dx * dx + dy * dy;
            if (d.spec.shield && d2 < d.spec.shield * d.spec.shield) {
                this.bombs.splice(i--, 1);
                this.stats.decoy.lured++;
                this.fx.push({ x: bomb.x, y: bomb.y, r: 2, max: 12, color: '#ff8a5c' });
                this.damageDrone(game, d, 1, 'charge');
                break;
            }
            if (d.luring && bomb.velocity > 0 && dy > -10 && d2 < d.spec.lure * d.spec.lure) {
                bomb.vx = clamp(bomb.vx + (dx > 0 ? 1 : -1) * d.spec.pull * dt, -48, 48);
                if (!bomb.lured && d.type === 'decoy') { bomb.lured = true; this.stats.decoy.lured++; }
            }
        }
    }

    //  Move each bomb.
    for (i = 0; i < this.bombs.length; i++) {
        bomb = this.bombs[i];
        bomb.y += dt * bomb.velocity;
        bomb.x += dt * bomb.vx;

        //  Mines sink to their depth, sit there for a while, then go inert.
        if (bomb.mine) {
            if (bomb.velocity > 0 && bomb.y >= bomb.stopY) { bomb.velocity = 0; bomb.vx = 0; }
            if (bomb.velocity === 0) {
                bomb.life -= dt;
                if (bomb.life <= 0) { this.bombs.splice(i--, 1); }
            }
            continue;
        }

        //  A bomb that reaches the seabed damages the node.
        if (bomb.y > b.bottom) {
            this.bombs.splice(i--, 1);
            game.integrity -= 5;
            this.stats.leaked++;
            this.events.push({ k: 'leak', x: bomb.x });
            this.fx.push({ x: bomb.x, y: b.bottom, r: 2, max: 16, color: '#e8443a' });
        }
    }

    //  Move each rocket (striker torpedoes). Homing ones steer.
    for (i = 0; i < this.rockets.length; i++) {
        var rocket = this.rockets[i];
        if (rocket.homing && rocket.target && !rocket.target.dead) {
            var want = Math.atan2(rocket.target.x - rocket.x, rocket.y - rocket.target.y);
            var have = Math.atan2(rocket.vx, -rocket.vy);
            var diff = want - have;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            have += clamp(diff, -2.6 * dt, 2.6 * dt);
            var sp = Math.sqrt(rocket.vx * rocket.vx + rocket.vy * rocket.vy);
            rocket.vx = Math.sin(have) * sp; rocket.vy = -Math.cos(have) * sp;
        }
        rocket.x += dt * rocket.vx;
        rocket.y += dt * rocket.vy;
        rocket.life -= dt;
        if (rocket.y < 50 || rocket.x < 0 || rocket.x > W || rocket.life <= 0) {
            this.rockets.splice(i--, 1);
        }
    }

    //  Move each interceptor pellet.
    for (i = 0; i < this.pellets.length; i++) {
        var p = this.pellets[i];
        p.x += dt * p.vx; p.y += dt * p.vy; p.life -= dt;
        if (p.life <= 0) { this.pellets.splice(i--, 1); }
    }

    //  Move the invaders (formation march, from the original game).
    var hitLeft = false, hitRight = false, hitBottom = false, lowY = 100;
    for (i = 0; i < this.invaders.length; i++) {
        invader = this.invaders[i];
        if (invader.hunter || invader.boss || invader.flank) { continue; }
        var newx = invader.x + this.invaderVelocity.x * dt;
        var newy = invader.y + this.invaderVelocity.y * dt;
        if (hitLeft == false && newx < b.left + 14) {
            hitLeft = true;
        }
        else if (hitRight == false && newx > b.right - 14) {
            hitRight = true;
        }
        else if (hitBottom == false && newy > b.breach) {
            hitBottom = true;
        }

        if (!hitLeft && !hitRight && !hitBottom) {
            invader.x = newx;
            invader.y = newy;
        }
        if (invader.y > lowY) { lowY = invader.y; }
    }
    this.lowY = lowY;

    //  Update invader velocities.
    if (this.invadersAreDropping) {
        this.invaderCurrentDropDistance += this.invaderVelocity.y * dt;
        if (this.invaderCurrentDropDistance >= this.config.invaderDropDistance) {
            this.invadersAreDropping = false;
            this.invaderVelocity = this.invaderNextVelocity;
            this.invaderCurrentDropDistance = 0;
        }
    }
    //  If we've hit the left, move down then right.
    if (hitLeft) {
        this.invaderCurrentVelocity += this.config.invaderAcceleration;
        this.invaderVelocity = { x: 0, y: this.invaderCurrentVelocity };
        this.invadersAreDropping = true;
        this.invaderNextVelocity = { x: this.invaderCurrentVelocity, y: 0 };
    }
    //  If we've hit the right, move down then left.
    if (hitRight) {
        this.invaderCurrentVelocity += this.config.invaderAcceleration;
        this.invaderVelocity = { x: 0, y: this.invaderCurrentVelocity };
        this.invadersAreDropping = true;
        this.invaderNextVelocity = { x: -this.invaderCurrentVelocity, y: 0 };
    }

    //  Hunters break formation and ram the nearest vehicle they can find.
    for (i = 0; i < this.invaders.length; i++) {
        invader = this.invaders[i];
        if (invader.boss) {
            invader.x = W / 2 + Math.sin(this.elapsed * 0.35) * 300;
            continue;
        }
        if (!invader.hunter || invader.dead) { continue; }
        var prey = null, best = 1e9;
        for (j = 0; j < alive.length; j++) {
            if (alive[j].dead || alive[j].spec.stealth) { continue; }
            var hd = Math.abs(alive[j].x - invader.x) + Math.abs(alive[j].y - invader.y);
            if (hd < best) { best = hd; prey = alive[j]; }
        }
        var px = prey ? prey.x : invader.x, py = prey ? prey.y : b.bottom + 20;
        var hx = px - invader.x, hy = py - invader.y, hl = Math.sqrt(hx * hx + hy * hy) || 1;
        var hs = 62 + this.mission * 4;
        invader.x += hx / hl * hs * dt;
        invader.y += hy / hl * hs * dt;
        if (prey && hl < 14) {
            this.damageDrone(game, prey, 2, 'rammed');
            invader.dead = true;
            this.fx.push({ x: invader.x, y: invader.y, r: 3, max: 26, color: '#ffb060' });
        } else if (invader.y > b.bottom) {
            invader.dead = true;
            game.integrity -= 10;
            this.stats.leaked += 2;
        }
    }
    if (def.hunterEvery) {
        this.hunterTimer -= dt;
        if (this.hunterTimer <= 0) {
            this.hunterTimer = def.hunterEvery;
            var front = this.frontRank(), keys = Object.keys(front);
            if (keys.length > 2) {
                var h = front[keys[Math.floor(Math.random() * keys.length)]];
                if (h.type !== 'jammer') {
                    h.hunter = true; h.type = 'hunter'; h.hp = 2; h.maxHp = 2; h.classified = 1e9;
                    this.say("SONAR: hunter breaking formation!", '#e8443a');
                    game.sounds.playSound('ping');
                }
            }
        }
    }

    //  Flankers run down the edges on their own, outside the formation.
    if (this.flankLeft > 0) {
        this.flankTimer -= dt;
        if (this.flankTimer <= 0) {
            this.flankTimer = 9;
            var leftSide = this.flankLeft % 2 === 0;
            var fl = new Invader(leftSide ? b.left + 40 : b.right - 40, b.top - 10, -1, -1, 'flanker');
            fl.flank = true; fl.hp = 2; fl.maxHp = 2; fl.baseX = fl.x; fl.phase = Math.random() * 6;
            this.invaders.push(fl);
            this.flankLeft--;
            this.say("SONAR: flanker running down the " + (leftSide ? "left" : "right") + " edge.", '#ff9a3c');
        }
    }
    for (i = 0; i < this.invaders.length; i++) {
        invader = this.invaders[i];
        if (invader.flank && !invader.dead) {
            invader.y += 21 * dt;
            invader.x = invader.baseX + Math.sin(this.elapsed * 1.3 + invader.phase) * 26;
            if (invader.y > b.breach) { hitBottom = true; }
            if (this.bombRate * 2.2 * dt > Math.random()) {
                this.bombs.push(new Bomb(invader.x, invader.y + 6, this.bombMaxVelocity));
            }
        }
        //  Minelayers seed mines that sink to mid-water.
        if (invader.type === 'minelayer' && !invader.dead && !invader.hunter) {
            invader.mineTimer -= dt;
            if (invader.mineTimer <= 0) {
                invader.mineTimer = 4;
                var mine = new Bomb(invader.x, invader.y + 8, 42);
                mine.mine = true; mine.life = 30;
                mine.stopY = Math.min(b.breach - 10, Math.max(invader.y + 90, 300 + Math.random() * 160));
                this.bombs.push(mine);
            }
        }
    }

    //  The mothership drops salvos and launches hunters.
    var bossShip = null;
    for (i = 0; i < this.invaders.length; i++) { if (this.invaders[i].boss && !this.invaders[i].dead) { bossShip = this.invaders[i]; } }
    if (bossShip) {
        this.bossBombTimer -= dt; this.bossHunterTimer -= dt;
        if (this.bossBombTimer <= 0) {
            this.bossBombTimer = 3.3;
            for (j = -2; j <= 2; j++) { this.bombs.push(new Bomb(bossShip.x + j * 26, bossShip.y + 14, this.bombMaxVelocity * 1.15)); }
        }
        if (this.bossHunterTimer <= 0) {
            this.bossHunterTimer = 7.5;
            var nh = new Invader(bossShip.x, bossShip.y + 16, -1, -1, 'hunter');
            nh.hunter = true; nh.hp = 2; nh.maxHp = 2; nh.classified = 1e9;
            this.invaders.push(nh);
            this.say("SONAR: mothership launching a hunter!", '#e8443a');
        }
    }

    //  Scouts (and, at very short range, every vehicle) classify contacts. Jammers interfere.
    var jammers = [];
    for (i = 0; i < this.invaders.length; i++) { if (this.invaders[i].type === 'jammer' && !this.invaders[i].dead) jammers.push(this.invaders[i]); }
    for (i = 0; i < this.invaders.length; i++) {
        invader = this.invaders[i];
        if (invader.boss) { continue; }
        invader.classified -= dt;
        if (invader.classified <= 0) { invader.weak = 0; }
        var jammed = false;
        for (j = 0; j < jammers.length; j++) {
            if (Math.abs(jammers[j].x - invader.x) < 125 && Math.abs(jammers[j].y - invader.y) < 100) { jammed = true; break; }
        }
        for (j = 0; j < alive.length; j++) {
            d = alive[j];
            if (d.dead) { continue; }
            var range = d.type === 'scout' ? d.spec.sensor : (d.spec.selfClassify || 70);
            if (jammed) { range *= 0.45; }
            var cx = d.x - invader.x, cy = d.y - invader.y;
            if (cx * cx + cy * cy < range * range) {
                if (invader.classified <= 0 && d.type === 'scout') { this.stats.scout.classified++; }
                invader.classified = Math.max(invader.classified, d.type === 'scout' ? d.spec.classifyTime : 1.5);
                if (d.type === 'scout' && d.spec.weak > invader.weak) { invader.weak = d.spec.weak; }
            }
        }
    }

    //  Every vehicle thinks for itself.
    for (i = 0; i < this.drones.length; i++) {
        d = this.drones[i];
        if (!d.dead) { this.updateDrone(game, d, dt); }
    }

    //  Check for rocket/invader collisions.
    for (i = 0; i < this.invaders.length; i++) {
        invader = this.invaders[i];
        if (invader.dead) { continue; }
        for (j = 0; j < this.rockets.length; j++) {
            rocket = this.rockets[j];
            if (rocket.x >= (invader.x - invader.width / 2) && rocket.x <= (invader.x + invader.width / 2) &&
                rocket.y >= (invader.y - invader.height / 2) && rocket.y <= (invader.y + invader.height / 2)) {
                this.rockets.splice(j--, 1);
                this.stats.striker.hits++;
                this.hitInvader(game, invader, rocket.dmg, rocket.owner);
                break;
            }
        }
    }

    //  Pellets stop bombs, and chip at hunters.
    for (i = 0; i < this.pellets.length; i++) {
        p = this.pellets[i];
        var used = false;
        for (j = 0; j < this.bombs.length && !used; j++) {
            bomb = this.bombs[j];
            if (Math.abs(bomb.x - p.x) < 9 && Math.abs(bomb.y - p.y) < 9) {
                this.bombs.splice(j, 1);
                this.stats.interceptor.intercepts++;
                this.fx.push({ x: p.x, y: p.y, r: 2, max: p.flak ? p.flak : 10, color: '#ffd24a' });
                if (p.flak) {
                    for (var q = 0; q < this.bombs.length; q++) {
                        var ob = this.bombs[q];
                        if ((ob.x - p.x) * (ob.x - p.x) + (ob.y - p.y) * (ob.y - p.y) < p.flak * p.flak) {
                            this.bombs.splice(q--, 1); this.stats.interceptor.intercepts++;
                        }
                    }
                }
                used = true;
            }
        }
        for (j = 0; j < this.invaders.length && !used; j++) {
            invader = this.invaders[j];
            if (invader.hunter && !invader.dead && Math.abs(invader.x - p.x) < 13 && Math.abs(invader.y - p.y) < 10) {
                this.hitInvader(game, invader, p.hunterDmg, p.owner);
                used = true;
            }
        }
        if (used) { this.pellets.splice(i--, 1); }
    }

    //  Remove dead invaders and vehicles.
    for (i = 0; i < this.invaders.length; i++) {
        if (this.invaders[i].dead) { this.invaders.splice(i--, 1); }
    }
    for (i = 0; i < this.drones.length; i++) {
        if (this.drones[i].dead) { this.drones.splice(i--, 1); }
    }

    //  Give each front rank invader a chance to drop a bomb.
    var frontRankInvaders = this.frontRank();
    for (var file in frontRankInvaders) {
        invader = frontRankInvaders[file];
        var chance = this.bombRate * dt;
        if (chance > Math.random()) {
            this.bombs.push(new Bomb(invader.x, invader.y + invader.height / 2,
                this.bombMinVelocity + Math.random() * (this.bombMaxVelocity - this.bombMinVelocity)));
        }
    }

    //  Check for bomb/vehicle collisions.
    for (i = 0; i < this.bombs.length; i++) {
        bomb = this.bombs[i];
        for (j = 0; j < this.drones.length; j++) {
            d = this.drones[j];
            if (d.dead) { continue; }
            if (Math.abs(bomb.x - d.x) < 11 && Math.abs(bomb.y - d.y) < 10) {
                this.bombs.splice(i--, 1);
                this.damageDrone(game, d, bomb.mine ? 2 : 1, bomb.mine ? 'mine' : 'charge');
                break;
            }
        }
    }

    //  Check for invader/vehicle collisions.
    for (i = 0; i < this.invaders.length; i++) {
        invader = this.invaders[i];
        if (invader.hunter) { continue; }
        for (j = 0; j < this.drones.length; j++) {
            d = this.drones[j];
            if (!d.dead && Math.abs(invader.x - d.x) < invader.width / 2 + 7 && Math.abs(invader.y - d.y) < invader.height / 2 + 7) {
                this.killDrone(game, d, 'overrun');
            }
        }
    }

    //  Check for failure.
    var strikeLeft = this.reserves.striker > 0;
    for (i = 0; i < this.drones.length; i++) {
        if (this.drones[i].type === 'striker' && !this.drones[i].dead) { strikeLeft = true; }
    }
    var reason = null;
    if (hitBottom) { reason = "The flotilla broke through to the cable node."; }
    else if (game.integrity <= 0) { game.integrity = 0; reason = "The cable node was destroyed by depth charges."; }
    else if (!strikeLeft) { reason = "Every striker was lost. Nothing left to shoot with."; }
    if (reason) {
        game.sounds.playSound('explosion');
        game.finishMission(this, false, reason);
        return;
    }

    //  Check for victory.
    if (this.invaders.length === 0 && this.flankLeft <= 0) {
        game.finishMission(this, true, "Flotilla destroyed.");
    }
};

//  Find all of the front rank invaders (from the original game).
PlayState.prototype.frontRank = function() {
    var frontRankInvaders = {};
    for (var i = 0; i < this.invaders.length; i++) {
        var invader = this.invaders[i];
        if (invader.hunter || invader.boss || invader.flank || invader.dead) { continue; }
        if (!frontRankInvaders[invader.file] || frontRankInvaders[invader.file].rank < invader.rank) {
            frontRankInvaders[invader.file] = invader;
        }
    }
    return frontRankInvaders;
};

/*
    Vehicle autonomy. Each vehicle follows the doctrine it was launched with.
*/
PlayState.prototype.updateDrone = function(game, d, dt) {
    var b = game.gameBounds, spec = d.spec, i;
    var doc = this.think(game, d, dt);
    var st = this.station(game, d);
    var tx = st.x, ty = st.y;
    d.cool -= dt;
    d.flash -= dt;
    d.blocked = false;
    d.aim = null;
    d.luring = spec.lure > 0;

    //  Doctrine: go home when damaged.
    if (!d.rtb && doc.retreat === 'damaged' && d.hp < d.maxHp && d.hp <= d.maxHp / 2) {
        d.rtb = true;
        this.say(d.name + ": damaged, returning to base.", '#ffd24a');
    }

    //  Dodge incoming bombs. Decoys do not dodge, that is their job.
    var push = 0;
    if (d.type !== 'decoy') {
        var reach = doc.threat === 'evasive' ? 150 : 110, lane = doc.threat === 'evasive' ? 34 : 26;
        for (i = 0; i < this.bombs.length; i++) {
            var bm = this.bombs[i];
            var ddx = d.x - bm.x, ddy = d.y - bm.y;
            if (ddy > -6 && ddy < reach && Math.abs(ddx) < lane) {
                push += (ddx >= 0 ? 1 : -1) * (lane - Math.abs(ddx)) / lane;
            }
        }
        push = clamp(push, -1, 1);
    }
    var dodge = spec.dodge * (doc.threat === 'press' ? 0.35 : doc.threat === 'evasive' ? 1.8 : 1);
    var evading = doc.threat === 'evasive' && Math.abs(push) > 0.15;

    if (d.rtb) {
        //  Heading home to be repaired and returned to the reserve.
        tx = W / 2; ty = b.bottom + 4;
        d.luring = false;
        d.thought = "Returning to base.";
        if (Math.abs(d.x - tx) < 12 && Math.abs(d.y - ty) < 12) {
            d.dead = true;
            this.slotsFree[d.type].push(d.slot);
            this.reserves[d.type]++;
            this.stats[d.type].returned++;
            this.say("BASE: " + d.name + " recovered, repaired, back in reserve.", '#9fe8c4');
            if (this.inspect === d) { this.inspect = null; }
            return;
        }
    }
    else if (d.type === 'striker') {
        var leash = doc.pursuit === 'track' ? 170 : 40;
        d.retarget -= dt;
        if (d.retarget <= 0 || !d.target || d.target.dead) {
            d.target = this.pickTarget(d);
            d.retarget = 0.6;
        }
        var tgt = d.target;
        if (!tgt) {
            d.thought = doc.discipline === 'classified' ? "Holding fire: no classified contacts in reach." : "No target in reach.";
            this.stats.striker.idle += dt;
        } else {
            var vel = (tgt.hunter || tgt.boss) ? { x: 0, y: 0 } : this.invaderVelocity;
            var dist = Math.sqrt((tgt.x - d.x) * (tgt.x - d.x) + (tgt.y - d.y) * (tgt.y - d.y));
            var lead = dist / spec.projSpeed;
            var ax = tgt.x + vel.x * lead, ay = tgt.y + vel.y * lead;
            tx = clamp(ax, st.x - leash, st.x + leash);
            d.aim = tgt;
            var ang = Math.atan2(ax - d.x, d.y - ay);
            var cone = spec.homing ? 1.0 : 0.6;
            var known = tgt.classified > 0 || tgt.boss;
            if (d.cool > 0) { d.thought = "Reloading. Target: " + tgt.type + (known ? "" : " (unclassified)") + "."; }
            else if (doc.holdFire) { d.thought = "Holding fire on standing order."; }
            else if (evading) { d.thought = "Evading, holding fire."; }
            else if (Math.abs(ang) > cone || ay > d.y - 20) { d.thought = "Target outside firing arc, manoeuvring."; this.stats.striker.idle += dt; }
            else if (doc.discipline === 'close' && dist > 210) { d.thought = "Holding fire: target beyond close range."; this.stats.striker.idle += dt; }
