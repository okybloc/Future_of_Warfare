            else if (dist > spec.fireRange) { d.thought = "Holding fire: target beyond weapon reach."; this.stats.striker.idle += dt; }
            else if (this.lineBlocked(d, ax, ay)) { d.blocked = true; d.thought = "Holding fire: friendly in the line of fire."; this.stats.striker.fouled += dt; }
            else {
                var err = (spec.homing ? 0.02 : (known ? spec.errC : spec.errU)) * (Math.random() * 2 - 1);
                var r = new Rocket(d.x, d.y - 9, Math.sin(ang + err) * spec.projSpeed, -Math.cos(ang + err) * spec.projSpeed, d);
                r.dmg = spec.dmg; r.homing = spec.homing; r.target = tgt;
                r.life = spec.fireRange < 9000 ? spec.fireRange / spec.projSpeed * 1.25 : 9;
                this.rockets.push(r);
                this.stats.striker.shots++;
                if (known) { this.stats.classifiedAtShot++; }
                d.cool = (spec.doubleTap && Math.random() < spec.doubleTap) ? 0.25 : spec.cool;
                d.thought = "Engaging " + tgt.type + ".";
                game.sounds.playSound('shoot');
            }
        }
    }
    else if (d.type === 'interceptor') {
        var threats = this.pickThreats(d);
        if (threats.length) {
            var leash2 = doc.pursuit === 'track' ? 150 : 35;
            tx = clamp(threats[0].x, st.x - leash2, st.x + leash2);
            d.aim = threats[0];
            d.thought = threats[0].hunter ? "Engaging hunter." : "Engaging depth charge.";
            if (d.cool <= 0 && !evading && !doc.holdFire) {
                for (i = 0; i < (spec.twin ? 2 : 1) && i < threats.length; i++) {
                    var th = threats[i];
                    th.claimed = d;
                    var td = Math.sqrt((th.x - d.x) * (th.x - d.x) + (th.y - d.y) * (th.y - d.y));
                    var tt = td / spec.projSpeed;
                    var aimX = th.x + (th.vx || 0) * tt, aimY = th.y + (th.velocity || 0) * tt;
                    var a = Math.atan2(aimX - d.x, d.y - aimY);
                    this.pellets.push({ x: d.x, y: d.y - 6, vx: Math.sin(a) * spec.projSpeed, vy: -Math.cos(a) * spec.projSpeed,
                        life: spec.range / spec.projSpeed * 1.3, owner: d, flak: spec.flak, hunterDmg: spec.hunterDmg });
                    this.stats.interceptor.shots++;
                }
                d.cool = spec.cool;
            }
        } else {
            d.thought = "Scanning. Nothing in range it is told to protect against.";
        }
    }
    else if (d.type === 'scout') {
        d.thought = "On station, classifying contacts within " + Math.round(spec.sensor) + ".";
    }
    else {
        if (doc.holdFire) { d.luring = false; d.thought = "Gone quiet on standing order."; }
        else if (doc.lure === 'quiet' && d.hp <= d.maxHp / 2) { d.luring = false; d.thought = "Gone quiet to repair."; }
        else { d.thought = spec.shield ? "Shield up." : "Emitting, luring charges."; }
        d.regen += dt;
        if (d.regen > spec.regen && d.hp < d.maxHp) { d.hp++; d.regen = 0; }
    }
    if (evading && !d.rtb) { d.thought = "Evading depth charges."; }
    if (d.type !== 'decoy') { tx += push * 46 * dodge; }

    //  Move towards the desired point.
    var mx = tx - d.x, my = ty - d.y, ml = Math.sqrt(mx * mx + my * my);
    if (ml > 0.5) {
        var sp = Math.min(spec.speed, ml * 5);
        d.x += mx / ml * sp * dt;
        d.y += my / ml * sp * dt;
    }
    d.x = clamp(d.x, b.left, b.right);

    //  Leave a short wake so the commander can see where it has been.
    d.trailT -= dt;
    if (d.trailT <= 0) {
        d.trailT = 0.15;
        d.trail.push(d.x, d.y);
        if (d.trail.length > 44) { d.trail.splice(0, 2); }
    }
};

//  A striker picks its own target according to its doctrine.
PlayState.prototype.pickTarget = function(d) {
    var doc = d.eff || d.doc, best = null, bestScore = 1e9;
    for (var i = 0; i < this.invaders.length; i++) {
        var inv = this.invaders[i];
        if (inv.dead || inv.y > d.y - 20) { continue; }
        var known = inv.classified > 0 || inv.boss;
        if (doc.discipline === 'classified' && !known) { continue; }
        var dx = Math.abs(inv.x - d.x), dist = Math.sqrt(dx * dx + (inv.y - d.y) * (inv.y - d.y));
        if (doc.pursuit === 'hold' && dx > 150) { continue; }
        var score;
        if (doc.priority === 'nearest') { score = dist; }
        else if (doc.priority === 'heavy') { score = -Math.min(inv.hp, 6) * 200 + dist * 0.3; }
        else if (doc.priority === 'weak') { score = (inv.hp < inv.maxHp ? -300 : 0) + Math.min(inv.hp, 6) * 100 + dist * 0.3; }
        else if (doc.priority === 'threat') { score = ((inv.hunter || inv.type === 'jammer') ? -600 : 0) - inv.y * 0.6 + dx * 0.3; }
        else { score = -inv.y + dx * 0.3; }
        if (inv.hunter && (dist < 130 || doc.huntFirst)) { score -= 1000; }
        //  Briefed at launch on a target area: prefer contacts near it.
        if (d.zone && Math.abs(inv.x - d.zone.x) < 110) { score -= 500; }
        if (!known && !d.spec.homing) { score += 70; }
        for (var j = 0; j < this.drones.length; j++) {
            var o = this.drones[j];
            if (o !== d && !o.dead && o.type === 'striker' && o.target === inv) { score += doc.coord === 'focus' ? -60 : 90; }
        }
        if (score < bestScore) { bestScore = score; best = inv; }
    }
    return best;
};

//  An interceptor ranks the threats in range according to its doctrine.
PlayState.prototype.pickThreats = function(d) {
    var doc = d.eff || d.doc, spec = d.spec, list = [], i, j;
    for (i = 0; i < this.bombs.length; i++) {
        var bomb = this.bombs[i];
        var bx = bomb.x - d.x, by = bomb.y - d.y;
        if (bx * bx + by * by > spec.range * spec.range || by > 0) { continue; }
        var score;
        if (doc.protect === 'node') { score = bomb.y - Math.abs(bx) * 0.3; }
        else if (doc.protect === 'nearest') { score = -(bx * bx + by * by) / 100; }
        else {
            score = -400 + bomb.y * 0.2;
            for (j = 0; j < this.drones.length; j++) {
                var f = this.drones[j];
                if (f !== d && !f.dead && f.y > bomb.y && Math.abs(f.x - bomb.x) < 30) { score = 400 - (f.y - bomb.y); break; }
            }
        }
        if (bomb.claimed && bomb.claimed !== d) { score -= 150; }
        //  A settled mine can wait until nothing is falling.
        if (bomb.mine && bomb.velocity === 0) { score -= 700; }
        bomb.score = score;
        list.push(bomb);
    }
    if (doc.hunters === 'engage') {
        for (i = 0; i < this.invaders.length; i++) {
            var hn = this.invaders[i];
            if (hn.hunter && !hn.dead && Math.abs(hn.x - d.x) + Math.abs(hn.y - d.y) < spec.range * 1.2) { hn.score = 5000; list.push(hn); }
        }
    }
    list.sort(function(a, c) { return c.score - a.score; });
    return list;
};

//  Strikers hold fire rather than shoot through a friendly.
PlayState.prototype.lineBlocked = function(d, ax, ay) {
    var sx = ax - d.x, sy = ay - d.y, len2 = sx * sx + sy * sy;
    for (var i = 0; i < this.drones.length; i++) {
        var o = this.drones[i];
        if (o === d || o.dead || o.y > d.y - 6) { continue; }
        var t = clamp(((o.x - d.x) * sx + (o.y - d.y) * sy) / len2, 0, 1);
        var qx = d.x + sx * t - o.x, qy = d.y + sy * t - o.y;
        if (qx * qx + qy * qy < 13 * 13) { return true; }
    }
    return false;
};

/*
    Base input during the engagement: field reserves, recall, pace, inspect.
*/
PlayState.prototype.keyDown = function(game, keyCode) {
    if (keyCode == KEY_SPACE) { this.paused = !this.paused; }
    if (keyCode >= KEY_1 && keyCode < KEY_1 + 4) {
        this.deploy(game, TYPE_ORDER[keyCode - KEY_1], false);
    }
    var rk = RECALL_KEYS.indexOf(keyCode);
    if (rk >= 0) { this.recall(game, TYPE_ORDER[rk], false); }
    if (keyCode == KEY_B) { this.burst(game); }
    if (keyCode == KEY_F) { game.speed = game.speed === 1 ? 2 : game.speed === 2 ? 4 : 1; }
    if (keyCode == KEY_ESC) { this.marker = null; this.inspect = null; }
};

PlayState.prototype.burst = function(game) {
    if (this.burstLeft <= 0) { this.say("BASE: no burst recalls left.", '#ff9a8a'); return; }
    this.burstLeft--;
    this.recall(game, null, true);
    this.fx.push({ x: W / 2, y: game.gameBounds.bottom, r: 10, max: 700, color: '#ffd24a' });
};

PlayState.prototype.mouseDown = function(game, x, y) {
    var i;
    for (i = 0; i < this.buttons.length; i++) {
        var bt = this.buttons[i];
        if (x >= bt.x && x <= bt.x + bt.w && y >= bt.y && y <= bt.y + bt.h) { bt.fn(); return; }
    }
    //  Otherwise: inspect the nearest vehicle.
    var best = null, bd = 24 * 24;
    for (i = 0; i < this.drones.length; i++) {
        var d = this.drones[i];
        var q = (d.x - x) * (d.x - x) + (d.y - y) * (d.y - y);
        if (q < bd) { bd = q; best = d; }
    }
    if (best) { this.inspect = best; return; }
    this.inspect = null;

    //  Otherwise: designate an area. The next reserves deployed are briefed to go there.
    var b = game.gameBounds;
    if (y > 56 && y < b.bottom - 4 && x > b.left && x < b.right) {
        if (this.marker && Math.abs(this.marker.x - x) < 16 && Math.abs(this.marker.y - y) < 16) { this.marker = null; }
        else { this.marker = { x: x, y: y, id: Math.random() }; game.sounds.playSound('ping'); }
    }
};

/*
    Drawing.
*/
PlayState.prototype.button = function(ctx, x, y, w, h, label, color, enabled, fn) {
    ctx.fillStyle = enabled ? 'rgba(14,42,30,0.95)' : 'rgba(8,16,12,0.9)';
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = enabled ? color : '#24382f'; ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
    ctx.font = "10px " + FONT; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = enabled ? color : '#4a6a5a';
    ctx.fillText(label, x + w / 2, y + h / 2 + 0.5);
    if (enabled) { this.buttons.push({ x: x, y: y, w: w, h: h, fn: fn }); }
};

PlayState.prototype.draw = function(game, dt, ctx) {
    var b = game.gameBounds, i, d, time = game.time, self = this;
    this.buttons = [];
    drawBackdrop(game, ctx);

    //  The comms boundary: below it base can talk to vehicles, above it they are alone.
    ctx.fillStyle = 'rgba(74,208,255,0.035)';
    ctx.fillRect(b.left, this.commsY, b.right - b.left, b.bottom - this.commsY);
    ctx.setLineDash([10, 6]);
    ctx.strokeStyle = 'rgba(74,208,255,0.55)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(b.left, this.commsY); ctx.lineTo(b.right, this.commsY); ctx.stroke();
    ctx.setLineDash([]);
    ctx.font = "10px " + FONT; ctx.textBaseline = "middle"; ctx.textAlign = "left";
    ctx.fillStyle = 'rgba(74,208,255,0.75)';
    ctx.fillText("COMMS BOUNDARY  ▲ autonomous territory   ▼ in link", b.left + 4, this.commsY + 9);

    //  The breach line and the node.
    ctx.setLineDash([6, 8]);
    ctx.strokeStyle = 'rgba(232,68,58,0.35)';
    ctx.beginPath(); ctx.moveTo(b.left, b.breach + 8); ctx.lineTo(b.right, b.breach + 8); ctx.stroke();
    ctx.setLineDash([]);
    ctx.textAlign = "right"; ctx.fillStyle = 'rgba(232,68,58,0.6)';
    ctx.fillText("BREACH LINE", b.right, b.breach + 18);
    ctx.fillStyle = game.integrity > 40 ? '#1aff9a' : '#e8443a';
    ctx.fillRect(W / 2 - 26, b.bottom - 8, 52, 8);
    ctx.fillRect(W / 2 - 5, b.bottom - 16, 10, 8);

    //  The designated area: where the next reserves will be sent.
    if (this.marker) {
        var mk = this.marker, onEnemy = mk.y < this.lowY + 30, mc = onEnemy ? '#e8443a' : '#1aff9a';
        ctx.strokeStyle = mc; ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 5]);
        ctx.beginPath(); ctx.moveTo(W / 2, b.bottom - 16); ctx.lineTo(mk.x, mk.y); ctx.stroke();
        if (onEnemy) { ctx.strokeRect(mk.x - 110, 56, 220, this.lowY - 40); }
        ctx.setLineDash([]);
        var mr = 13 + Math.sin(time * 6) * 2;
        ctx.beginPath(); ctx.arc(mk.x, mk.y, mr, 0, Math.PI * 2);
        ctx.moveTo(mk.x - mr - 6, mk.y); ctx.lineTo(mk.x - 5, mk.y); ctx.moveTo(mk.x + mr + 6, mk.y); ctx.lineTo(mk.x + 5, mk.y);
        ctx.moveTo(mk.x, mk.y - mr - 6); ctx.lineTo(mk.x, mk.y - 5); ctx.moveTo(mk.x, mk.y + mr + 6); ctx.lineTo(mk.x, mk.y + 5);
        ctx.stroke();
        ctx.font = "10px " + FONT; ctx.textAlign = "center"; ctx.fillStyle = mc;
        ctx.fillText(onEnemy ? "TARGET AREA" : "DEPLOY AREA", mk.x, mk.y + mr + 16);
    }

    //  Wakes.
    ctx.lineWidth = 1;
    for (i = 0; i < this.drones.length; i++) {
        d = this.drones[i];
        if (d.trail.length < 4) { continue; }
        ctx.strokeStyle = d.color; ctx.globalAlpha = d === this.inspect ? 0.6 : 0.22;
        ctx.beginPath(); ctx.moveTo(d.trail[0], d.trail[1]);
        for (var tq = 2; tq < d.trail.length; tq += 2) { ctx.lineTo(d.trail[tq], d.trail[tq + 1]); }
        ctx.lineTo(d.x, d.y);
        ctx.stroke();
    }
    ctx.globalAlpha = 1;

    //  Sensor, relay and lure rings.
    for (i = 0; i < this.drones.length; i++) {
        d = this.drones[i];
        if (d.type === 'scout') {
            ctx.strokeStyle = 'rgba(216,255,233,0.10)';
            ctx.beginPath(); ctx.arc(d.x, d.y, d.spec.sensor, 0, Math.PI * 2); ctx.stroke();
            if (d.spec.relay) {
                ctx.setLineDash([10, 6]); ctx.strokeStyle = 'rgba(74,208,255,0.4)';
                ctx.beginPath(); ctx.arc(d.x, d.y, d.spec.relay, 0, Math.PI * 2); ctx.stroke();
                ctx.setLineDash([]);
            }
        } else if (d.luring) {
            ctx.strokeStyle = 'rgba(255,138,92,' + (0.10 + 0.08 * Math.sin(time * 4)) + ')';
            ctx.beginPath(); ctx.arc(d.x, d.y, d.spec.lure * (0.55 + 0.45 * ((time * 0.6) % 1)), 0, Math.PI * 2); ctx.stroke();
        } else if (d.spec.shield) {
            ctx.strokeStyle = 'rgba(255,138,92,0.35)';
            ctx.beginPath(); ctx.arc(d.x, d.y, d.spec.shield, 0, Math.PI * 2); ctx.stroke();
        }
    }

    //  Draw invaders.
    for (i = 0; i < this.invaders.length; i++) {
        this.invaders[i].flash -= dt;
        drawInvader(ctx, this.invaders[i], time);
    }

    //  Draw bombs.
    for (i = 0; i < this.bombs.length; i++) {
        var bomb = this.bombs[i];
        if (bomb.mine) {
            ctx.strokeStyle = '#3fd6c0'; ctx.fillStyle = '#3fd6c0'; ctx.lineWidth = 1;
            ctx.globalAlpha = bomb.velocity === 0 && bomb.life < 5 ? 0.4 : 1;
            ctx.beginPath(); ctx.arc(bomb.x, bomb.y, 4, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath();
            for (var sp = 0; sp < 6; sp++) {
                var sa = sp * Math.PI / 3 + time;
                ctx.moveTo(bomb.x + Math.cos(sa) * 4, bomb.y + Math.sin(sa) * 4);
                ctx.lineTo(bomb.x + Math.cos(sa) * 8, bomb.y + Math.sin(sa) * 8);
            }
            ctx.stroke();
            ctx.globalAlpha = 1;
            continue;
        }
        ctx.fillStyle = '#ff5555';
        ctx.beginPath(); ctx.arc(bomb.x, bomb.y, 3, 0, Math.PI * 2); ctx.fill();
        ctx.fillRect(bomb.x - 0.5, bomb.y - 9, 1, 6);
    }

    //  Draw rockets.
    ctx.strokeStyle = '#9fe8ff'; ctx.lineWidth = 2;
    ctx.beginPath();
    for (i = 0; i < this.rockets.length; i++) {
        var rocket = this.rockets[i];
        ctx.moveTo(rocket.x, rocket.y);
        ctx.lineTo(rocket.x - rocket.vx * 0.035, rocket.y - rocket.vy * 0.035);
    }
    ctx.stroke();

    //  Draw pellets.
    ctx.fillStyle = '#ffd24a';
    for (i = 0; i < this.pellets.length; i++) {
        ctx.fillRect(this.pellets[i].x - 1, this.pellets[i].y - 1, 2, 2);
    }

    //  Draw the fleet.
    for (i = 0; i < this.drones.length; i++) {
        d = this.drones[i];
        var linked = this.inLink(d);
        if (d === this.inspect) {
            ctx.strokeStyle = '#1aff9a'; ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.arc(d.x, d.y, 15, 0, Math.PI * 2); ctx.stroke();
            if (d.aim && !d.aim.dead) {
                ctx.setLineDash([3, 4]); ctx.strokeStyle = 'rgba(26,255,154,0.5)'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.aim.x, d.aim.y); ctx.stroke();
                ctx.setLineDash([]);
            }
        }
        if (d.flash > 0) { ctx.globalAlpha = 0.4; }
        drawDroneIcon(ctx, d.type, d.x, d.y, time + i);
        ctx.globalAlpha = 1;
        if (d.maxHp > 1) {
            for (var k = 0; k < d.maxHp; k++) {
                ctx.fillStyle = k < d.hp ? d.color : 'rgba(255,255,255,0.15)';
                ctx.fillRect(d.x - d.maxHp * 2.5 + k * 5, d.y + 13, 3, 2);
            }
        }
        //  Link pip: cyan when base can reach it.
        ctx.fillStyle = linked ? '#4ad0ff' : 'rgba(255,255,255,0.18)';
        ctx.fillRect(d.x + 11, d.y - 12, 3, 3);
        ctx.font = "9px " + FONT; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        if (d.rtb) { ctx.fillStyle = '#ffd24a'; ctx.fillText('RTB', d.x, d.y - 17); }
        else if (d.blocked) { ctx.fillStyle = '#ffd24a'; ctx.fillText('LINE FOULED', d.x, d.y + 24); }
    }

    //  Effects.
    for (i = 0; i < this.fx.length; i++) {
        var f = this.fx[i];
        ctx.globalAlpha = Math.max(0, 1 - f.r / f.max);
        ctx.strokeStyle = f.color; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    //  Top bar.
    ctx.fillStyle = 'rgba(2,10,6,0.88)';
    ctx.fillRect(0, 0, W, 40);
    ctx.font = "13px " + FONT; ctx.textBaseline = "middle";
    ctx.textAlign = "left"; ctx.fillStyle = '#1aff9a';
    ctx.fillText("M" + (this.mission + 1) + " " + this.def.name, 14, 20);
    ctx.fillStyle = '#bfe8d4';
    ctx.fillText("CONTACTS " + (this.invaders.length + this.flankLeft), 200, 20);
    var mm = Math.floor(this.elapsed / 60), ss = Math.floor(this.elapsed % 60);
    ctx.fillText("T+" + mm + ":" + (ss < 10 ? "0" : "") + ss, 316, 20);
    this.button(ctx, 384, 9, 104, 22, (this.paused ? "RESUME" : "PAUSE") + " [SPACE]", '#1aff9a', true, function() { self.paused = !self.paused; });
    this.button(ctx, 494, 9, 92, 22, "SPEED " + game.speed + "x [F]", '#1aff9a', true, function() { game.speed = game.speed === 1 ? 2 : game.speed === 2 ? 4 : 1; });
    this.button(ctx, 592, 9, 56, 22, "ABORT", '#e8443a', true, function() { game.finishMission(self, false, "Engagement aborted from base."); });
    ctx.font = "13px " + FONT; ctx.textAlign = "right";
    ctx.fillStyle = game.integrity > 40 ? '#bfe8d4' : '#e8443a';
    ctx.fillText("NODE " + Math.round(game.integrity) + "%", W - 146, 20);
    ctx.strokeStyle = '#175c40'; ctx.strokeRect(W - 136, 13, 120, 14);
    ctx.fillStyle = game.integrity > 40 ? '#1aff9a' : '#e8443a';
    ctx.fillRect(W - 134, 15, 116 * Math.max(0, game.integrity) / 100, 10);

    //  Comms log.
    ctx.textAlign = "left"; ctx.font = "11px " + FONT;
    for (i = 0; i < this.comms.length; i++) {
        var c = this.comms[i];
        if (c.t <= 0) { continue; }
        ctx.globalAlpha = Math.min(1, c.t / 2) * (1 - i * 0.12);
        ctx.fillStyle = c.color;
        ctx.fillText(c.text, 16, 62 + i * 14);
    }
    ctx.globalAlpha = 1;

    //  Telemetry for the inspected vehicle.
    if (this.inspect) {
        d = this.inspect;
        var px = W - 316, py = 50;
        var ph = d.ruleNote ? 78 : 62;
        ctx.fillStyle = 'rgba(2,10,6,0.85)'; ctx.fillRect(px, py, 300, ph);
        ctx.strokeStyle = d.color; ctx.strokeRect(px + 0.5, py + 0.5, 299, ph - 1);
        if (d.ruleNote) { ctx.font = "10px " + FONT; ctx.textAlign = "left"; ctx.fillStyle = '#cdb0ff'; ctx.fillText(d.ruleNote, px + 10, py + 63); }
        ctx.font = "12px " + FONT; ctx.textAlign = "left"; ctx.fillStyle = d.color;
        ctx.fillText(d.name + "   hull " + Math.max(0, Math.ceil(d.hp)) + "/" + d.maxHp, px + 10, py + 14);
        ctx.font = "10px " + FONT;
        ctx.fillStyle = this.inLink(d) ? '#4ad0ff' : '#7fae95';
        ctx.fillText(this.inLink(d) ? "IN LINK: will hear a recall" : "OUT OF LINK: on its own", px + 10, py + 31);
        ctx.fillStyle = '#bfe8d4';
        ctx.fillText(d.thought || "", px + 10, py + 47);
    }

    //  Base console: field reserves and recall, one panel per type.
    ctx.fillStyle = 'rgba(2,10,6,0.94)';
    ctx.fillRect(0, H - 50, W, 50);
    for (i = 0; i < TYPE_ORDER.length; i++) {
        (function(type, idx) {
            var rx = 8 + idx * 190, ry = H - 47, field = self.aliveDrones(type).length, res = self.reserves[type];
            ctx.strokeStyle = '#175c40'; ctx.lineWidth = 1; ctx.strokeRect(rx + 0.5, ry + 0.5, 184, 44);
            drawDroneIcon(ctx, type, rx + 12, ry + 12, time);
            ctx.font = "11px " + FONT; ctx.textAlign = "left"; ctx.textBaseline = "middle";
            ctx.fillStyle = DRONE_TYPES[type].color;
            ctx.fillText(DRONE_TYPES[type].label, rx + 25, ry + 12);
            ctx.fillStyle = '#9fc8b0'; ctx.font = "9px " + FONT; ctx.textAlign = "right";
            ctx.fillText("OUT " + field + "  RES " + res, rx + 179, ry + 12);
            self.button(ctx, rx + 5, ry + 24, 85, 16, "DEPLOY [" + (idx + 1) + "]", '#1aff9a', res > 0, function() { self.deploy(game, type, false); });
            self.button(ctx, rx + 94, ry + 24, 85, 16, "RECALL [" + RECALL_LABELS[idx] + "]", '#4ad0ff', field > 0, function() { self.recall(game, type, false); });
        })(TYPE_ORDER[i], i);
    }
    this.button(ctx, 770, H - 47, 182, 21, "BURST RECALL ALL [B]  " + this.burstLeft + " left", '#ffd24a', this.burstLeft > 0, function() { self.burst(game); });
    ctx.font = "9px " + FONT; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = '#7fae95';
    ctx.fillText(this.marker ? "next reserves go to the marked area" : "click water or contacts to mark", 861, H - 18);
    ctx.fillText(this.marker ? "ESC clears the mark" : "where reserves deploy", 861, H - 8);

    if (this.paused) {
        ctx.fillStyle = 'rgba(2,10,6,0.45)';
        ctx.fillRect(0, 40, W, H - 90);
        drawCentered(ctx, "PAUSED", 250, 30, '#ffd24a');
        drawCentered(ctx, "click any vehicle to read its telemetry  ·  SPACE to resume", 282, 13, '#bfe8d4');
    }
};

/*
    Report State: the after-action report. Adjust and re-run, or move on.
*/
function ReportState(play, won, reason, firstClear) {
    this.play = play; this.won = won; this.reason = reason; this.firstClear = firstClear;
}

ReportState.prototype.draw = function(game, dt, ctx) { drawBackdrop(game, ctx); };

ReportState.prototype.observations = function(game) {
    var s = this.play.stats, out = [], st = s.striker, play = this.play;
    if (st.shots >= 8) {
        var acc = st.hits / st.shots;
        if (acc < 0.5) {
            out.push("Strikers hit with " + Math.round(acc * 100) + "% of " + st.shots + " torpedoes. Only " +
                Math.round(100 * s.classifiedAtShot / st.shots) + "% were fired at classified contacts. Better scouting, homing torpedoes or 'classified only' discipline would raise this.");
        } else {
            out.push("Strikers hit with " + Math.round(acc * 100) + "% of " + st.shots + " torpedoes.");
        }
    } else if (st.fielded > 0) {
        out.push("Strikers fired only " + st.shots + " torpedoes. Check their depth, pursuit and fire discipline.");
    }
    if (st.fouled > 6) { out.push("Strikers lost " + Math.round(st.fouled) + " vehicle-seconds holding fire because a friendly was in the line of fire. Move scouts and decoys out of their lanes."); }
    if (st.idle > 25) { out.push("Strikers spent " + Math.round(st.idle) + " vehicle-seconds with nothing they were allowed or able to shoot."); }
    if (s.leaked >= 4) { out.push(s.leaked + " charges reached the node (-" + (s.leaked * 5) + "%). Interceptors stopped " + s.interceptor.intercepts + ", decoys drew off " + s.decoy.lured + "."); }
    if (s.causes.rammed >= 2) { out.push(s.causes.rammed + " vehicles were rammed by hunters. Tell something to kill hunters first."); }
    if (s.causes.mine >= 1) { out.push(s.causes.mine + " vehicles hit mines. Sink the minelayers first, keep stations out of mid-water, or give interceptors time to sweep."); }
    if (s.causes.overrun >= 1) { out.push(s.causes.overrun + " vehicles were overrun by the formation itself."); }
    if (s.causes.charge >= 4) { out.push(s.causes.charge + " vehicles were lost to depth charges. Consider evasive doctrine, decoys nearby, or interceptors protecting the fleet."); }
    if (s.scout.fielded === 0) { out.push("No scouts were fielded, so almost every contact stayed unclassified."); }
    var left = 0;
    for (var i = 0; i < TYPE_ORDER.length; i++) { left += play.reserves[TYPE_ORDER[i]]; }
    if (!this.won && left > 0) { out.push(left + " vehicles were still sitting in reserve when the engagement ended."); }
    if (out.length === 0) { out.push("Clean engagement. Nothing obvious to fix."); }
    return out;
};

ReportState.prototype.enter = function(game) {
    var self = this, play = this.play, s = play.stats, m = play.mission, i, h = '';
    var last = m === MISSIONS.length - 1;
    h += '<div class="wrap">';
    h += '<div class="hdr"><div><h1>AFTER-ACTION REPORT</h1><div class="sub">MISSION ' + (m + 1) + ' &middot; ' + MISSIONS[m].name + ' &middot; ATTEMPT ' + progress.attempts[m] + '</div></div></div>';
    h += '<div class="box" style="margin-bottom:10px"><div class="result" style="color:' + (this.won ? 'var(--green)' : 'var(--red)') + '">' +
         (this.won ? (last ? 'CAMPAIGN COMPLETE' : 'MISSION ACCOMPLISHED') : 'MISSION FAILED') + '</div>';
    h += '<p>' + this.reason + ' Node integrity ' + Math.round(game.integrity) + '%. Time ' + Math.round(play.elapsed) + 's. ' +
         play.invaders.length + ' contacts remaining.</p>';
    if (this.won) {
        h += '<p class="stars">' + new Array(progress.stars[m] + 1).join('&#9733;') + '</p>';
        if (this.firstClear) { h += '<p style="color:#cdb0ff">+2 rune points earned.</p>'; }
    }
    h += '</div>';

    h += '<div class="row"><div class="box" style="flex:1.4 1 420px"><h2>WHAT EACH TYPE DID</h2><table><tr><th>TYPE</th><th>FIELDED</th><th>LOST</th><th>RETURNED</th><th>KILLS</th><th>SHOTS</th><th>HITS</th><th>CHARGES STOPPED</th></tr>';
    for (i = 0; i < TYPE_ORDER.length; i++) {
        var t = TYPE_ORDER[i], x = s[t];
        var stopped = t === 'interceptor' ? x.intercepts : t === 'decoy' ? x.lured : '&ndash;';
        h += '<tr><td style="color:' + DRONE_TYPES[t].color + '">' + DRONE_TYPES[t].plural + '</td><td>' + x.fielded + '</td><td>' + x.lost + '</td><td>' + x.returned +
             '</td><td>' + (t === 'scout' ? '&ndash;' : x.kills) + '</td><td>' + (t === 'striker' || t === 'interceptor' ? x.shots : '&ndash;') +
             '</td><td>' + (t === 'striker' ? x.hits : '&ndash;') + '</td><td>' + stopped + '</td></tr>';
    }
    h += '</table><p class="desc" style="margin-top:8px">Scouts classified ' + s.scout.classified + ' contacts. ' + s.leaked + ' charges reached the node.</p></div>';

    h += '<div class="box"><h2>OBSERVATIONS</h2><ul class="obs">';
    var obs = this.observations(game);
    for (i = 0; i < obs.length; i++) { h += '<li>' + obs[i] + '</li>'; }
    h += '</ul></div></div>';

    var mapHtml = '<div class="box" style="margin-top:10px"><h2>BATTLE MAP &mdash; WHERE IT HAPPENED</h2><canvas id="aarMap" style="width:100%;max-width:760px;display:block;margin:0 auto;border-radius:4px"></canvas>' +
         '<div class="desc" style="text-align:center"><span style="color:#ffb060">&#9679;</span> contact sunk &nbsp; <b style="color:#fff;font-weight:normal">&#10005;</b> vehicle lost (in its colour) &nbsp; <span style="color:#e8443a">&#9650;</span> charge reached the node</div></div>';

    h += '<div class="foot"><div class="desc">' + (this.won ? 'You can refine and re-run, or move on.' : 'Adjust the doctrine and run it again.') + '</div><div class="row">';
    h += '<button class="btn" data-act="rerun">RE-RUN UNCHANGED</button>';
    h += '<button class="btn' + (this.won && !last ? '' : ' big') + '" data-act="base">' + (this.won ? 'BACK TO BASE' : 'ADJUST AT HOME BASE') + '</button>';
    if (this.won && !last) { h += '<button class="btn big" data-act="next">NEXT MISSION</button>'; }
    h += '</div></div>' + mapHtml + '</div>';

    uiHandler = function(act) {
        if (act === 'rerun') { progress.mission = m; game.launch(false); }
        else if (act === 'next') { progress.mission = Math.min(m + 1, MISSIONS.length - 1); saveGame(); game.moveToState(new BaseState()); }
        else { progress.mission = m; game.moveToState(new BaseState()); }
    };
    showUI(h);
    ui.scrollTop = 0;

    //  Battle map: every kill, loss and leak, where it happened.
    var cv = document.getElementById('aarMap');
    if (!cv || !cv.getContext) { return; }
    var cssW = Math.min(cv.clientWidth || 600, 760), top = 50, sc = cssW / W, cssH = Math.round((H - top - 30) * sc);
    cv.style.height = cssH + 'px';
    cv.width = cssW * 2; cv.height = cssH * 2;
    var ctx = cv.getContext('2d'), b = BOUNDS;
    ctx.setTransform(sc * 2, 0, 0, sc * 2, 0, -top * sc * 2);
    ctx.fillStyle = '#04120c'; ctx.fillRect(0, top, W, H);
    ctx.setLineDash([10, 6]); ctx.lineWidth = 1.5;
    ctx.strokeStyle = 'rgba(74,208,255,0.6)';
    ctx.beginPath(); ctx.moveTo(b.left, play.commsY); ctx.lineTo(b.right, play.commsY); ctx.stroke();
    ctx.strokeStyle = 'rgba(232,68,58,0.45)';
    ctx.beginPath(); ctx.moveTo(b.left, b.breach + 8); ctx.lineTo(b.right, b.breach + 8); ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = '#175c40'; ctx.strokeRect(b.left, top + 4, b.right - b.left, b.bottom - top - 4);
    for (i = 0; i < play.events.length; i++) {
        var ev = play.events[i];
        if (ev.k === 'kill') {
            ctx.fillStyle = 'rgba(255,176,96,0.75)';
            ctx.beginPath(); ctx.arc(ev.x, ev.y, 4, 0, Math.PI * 2); ctx.fill();
        } else if (ev.k === 'loss') {
            ctx.strokeStyle = ev.color; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(ev.x - 8, ev.y - 8); ctx.lineTo(ev.x + 8, ev.y + 8);
            ctx.moveTo(ev.x + 8, ev.y - 8); ctx.lineTo(ev.x - 8, ev.y + 8); ctx.stroke();
        } else {
            ctx.fillStyle = '#e8443a';
            ctx.beginPath(); ctx.moveTo(ev.x, b.bottom - 14); ctx.lineTo(ev.x + 6, b.bottom - 2); ctx.lineTo(ev.x - 6, b.bottom - 2); ctx.closePath(); ctx.fill();
        }
    }
    //  Survivors, where they ended up.
    for (i = 0; i < play.drones.length; i++) {
        ctx.save(); ctx.translate(play.drones[i].x, play.drones[i].y); ctx.scale(1.4, 1.4);
        drawDroneIcon(ctx, play.drones[i].type, 0, 0, 0);
        ctx.restore();
    }
};
ReportState.prototype.leave = function() { hideUI(); uiHandler = null; };

/*
    Drone: an unmanned vehicle. It carries a frozen copy of its type's spec
    (loadout + runes) and doctrine from the moment it was launched.
*/
function Drone(type, slot, spec, doctrine) {
    var t = DRONE_TYPES[type];
    this.type = type;
    this.slot = slot;
    this.slots = 1;
    this.name = t.label + "-" + (slot + 1);
    this.color = t.color;
    this.spec = spec;
    this.doc = doctrine;
    this.x = 0;
    this.y = 0;
    this.hp = spec.hp;
    this.maxHp = spec.hp;
    this.dead = false;
    this.rtb = false;
    this.cool = 0.5 + Math.random();
    this.retarget = 0;
    this.target = null;
    this.aim = null;
    this.flash = 0;
    this.regen = 0;
    this.blocked = false;
    this.luring = false;
    this.thought = "";
    this.rules = null;
    this.eff = null;
    this.ruleTimer = 0;
    this.ruleNote = "";
    this.anchor = null;
    this.anchorId = 0;
    this.zone = null;
    this.trail = [];
    this.trailT = 0;
}

/*
    Rocket: fired by strikers, they've got a position and velocity.
*/
function Rocket(x, y, vx, vy, owner) {
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.owner = owner;
    this.dmg = 1;
    this.homing = false;
    this.target = null;
    this.life = 9;
}

/*
    Bomb: dropped by invaders, they've got position, velocity.
*/
function Bomb(x, y, velocity) {
    this.x = x;
    this.y = y;
    this.velocity = velocity;
    this.vx = 0;
}

/*
    Invader: position, type, rank/file, and hit points.
*/
function Invader(x, y, rank, file, type) {
    this.x = x;
    this.y = y;
    this.rank = rank;
    this.file = file;
    this.type = type;
    this.width = 28;
    this.height = 12;
    this.hp = type === 'tender' ? 2 : 1;
    this.maxHp = this.hp;
    this.classified = 0;
    this.weak = 0;
    this.flash = 0;
    this.hunter = false;
    this.boss = false;
    this.dead = false;
}

/*
    Sounds: the original loaded .wav files; this version synthesises the same
    three cues (shoot, bang, explosion) plus a sonar ping, so the game is one file.
*/
function Sounds() {
    this.audioContext = null;
    this.mute = false;
    this.last = {};
}

Sounds.prototype.init = function() {
    if (this.audioContext) { return; }
    try {
        var Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) { this.audioContext = new Ctx(); }
    } catch (e) { this.audioContext = null; }
};

Sounds.prototype.playSound = function(name) {
    var ac = this.audioContext;
    if (!ac || this.mute) { return; }
    var now = ac.currentTime;
    if (this.last[name] && now - this.last[name] < 0.07) { return; }
    this.last[name] = now;
    var gain = ac.createGain();
    gain.connect(ac.destination);
    if (name === 'shoot' || name === 'ping') {
        var osc = ac.createOscillator();
        osc.type = 'sine';
        var f0 = name === 'ping' ? 1400 : 620, f1 = name === 'ping' ? 1350 : 240, len = name === 'ping' ? 0.5 : 0.09;
        osc.frequency.setValueAtTime(f0, now);
        osc.frequency.exponentialRampToValueAtTime(f1, now + len);
        gain.gain.setValueAtTime(name === 'ping' ? 0.07 : 0.035, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + len);
        osc.connect(gain); osc.start(now); osc.stop(now + len);
    } else {
        var dur = name === 'explosion' ? 0.5 : 0.16;
        var buffer = ac.createBuffer(1, Math.floor(ac.sampleRate * dur), ac.sampleRate);
        var data = buffer.getChannelData(0);
        for (var i = 0; i < data.length; i++) { data[i] = (Math.random() * 2 - 1) * (1 - i / data.length); }
        var src = ac.createBufferSource();
        src.buffer = buffer;
        var filter = ac.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = name === 'explosion' ? 420 : 900;
        gain.gain.setValueAtTime(name === 'explosion' ? 0.22 : 0.1, now);
        src.connect(filter); filter.connect(gain); src.start(now);
    }
};

/* ------------------------------------------------------------------
    Page setup: canvas scaling, input wiring, and the loop.
   ------------------------------------------------------------------ */
var canvas = document.getElementById("gameCanvas");
var view = { scale: 1, css: 1 };

function resize() {
    var cssScale = Math.min(window.innerWidth / W, window.innerHeight / H);
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.style.width = Math.floor(W * cssScale) + "px";
    canvas.style.height = Math.floor(H * cssScale) + "px";
    canvas.width = Math.floor(W * cssScale * dpr);
    canvas.height = Math.floor(H * cssScale * dpr);
    view.scale = cssScale * dpr;
    view.css = cssScale;
}
resize();
window.addEventListener("resize", resize);

//  Create the game.
var game = new Game();
game.initialise(canvas);
game.start();
if (DEBUG_START === 'base') { game.moveToState(new BaseState()); }
if (DEBUG_START === 'play' || DEBUG_START === 'report') {
    game.launch(true);
    for (var warm = 0; warm < (DEBUG_START === 'report' ? 20000 : 1100); warm++) {
        if (game.currentState() instanceof PlayState) { game.currentState().update(game, 0.02); }
    }
}

function toLogical(e) {
    var r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / view.css, y: (e.clientY - r.top) / view.css };
}

window.addEventListener("keydown", function keydown(e) {
    var keycode = e.which || e.keyCode;
    if (keycode == KEY_SPACE && ui.style.display !== 'block') { e.preventDefault(); }
    if (e.repeat) { return; }
    game.keyDown(keycode);
});
window.addEventListener("keyup", function keyup(e) {
    game.keyUp(e.which || e.keyCode);
});
canvas.addEventListener("mousedown", function(e) {
    var p = toLogical(e);
    game.mouseDown(p.x, p.y);
    e.preventDefault();
});
window.addEventListener("mousemove", function(e) {
    var p = toLogical(e);
    game.mouseMove(p.x, p.y);
});
canvas.addEventListener("contextmenu", function(e) { e.preventDefault(); });

var lastFrame = 0;
function frame(now) {
    var dt = lastFrame ? Math.min(0.05, (now - lastFrame) / 1000) : 1 / game.config.fps;
    lastFrame = now;
    var ctx = canvas.getContext("2d");
    ctx.setTransform(view.scale, 0, 0, view.scale, 0, 0);
    GameLoop(game, dt);
    window.requestAnimationFrame(frame);
}
window.requestAnimationFrame(frame);
</script>
